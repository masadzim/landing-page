<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Kebab Factory POS | Owner Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F8FAFE;
      color: #111827;
      height: 100vh;
      overflow: hidden;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #FF6B00; border-radius: 10px; }

    /* layout utama */
    .app {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* ========= SIDEBAR ========= */
    .sidebar {
      width: 270px;
      background: #FFFFFF;
      border-right: 1px solid #EFF2F5;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      flex-shrink: 0;
      z-index: 20;
    }
    .sidebar-collapsed {
      width: 80px;
    }
    .sidebar-collapsed .logo-text,
    .sidebar-collapsed .nav-text,
    .sidebar-collapsed .user-info-text {
      display: none;
    }
    .sidebar-collapsed .nav-item {
      justify-content: center;
      padding: 12px;
    }
    .sidebar-collapsed .logo-area {
      justify-content: center;
    }
    .logo-area {
      padding: 24px 20px;
      border-bottom: 1px solid #F0F2F5;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      background: #FF6B00;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      color: white;
    }
    .logo-text {
      font-weight: 800;
      font-size: 1.25rem;
    }
    .logo-text span { color: #FF6B00; }

    .nav-menu {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 500;
      font-size: 0.9rem;
      color: #4B5563;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item i { width: 24px; font-size: 1.1rem; color: #9CA3AF; }
    .nav-item.active { background: #FFF4ED; color: #FF6B00; }
    .nav-item.active i { color: #FF6B00; }
    .nav-item:hover:not(.active) { background: #F9FAFB; }

    /* main area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #F8FAFE;
    }
    .topbar {
      background: white;
      padding: 16px 28px;
      border-bottom: 1px solid #EFF2F5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .collapse-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #4B5563;
    }
    .outlet-info h2 { font-size: 1.1rem; font-weight: 700; }
    .outlet-info p { font-size: 0.7rem; color: #6B7280; }
    .sync-status {
      background: #F3F4F6;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .online-dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; }
    .offline-dot { background: #EF4444; }

    /* content scroll */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }
    /* card grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 24px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
      border: 1px solid #EDF2F7;
      transition: all 0.2s;
    }
    .stat-title { font-size: 0.8rem; color: #6B7280; margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: #111827; }
    .flex-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 12px;
    }
    .info-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid #EDF2F7;
    }
    .info-card h3 {
      font-size: 1rem;
      margin-bottom: 16px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td {
      text-align: left;
      padding: 10px 6px;
      border-bottom: 1px solid #F0F2F5;
    }
    .badge {
      background: #F3F4F6;
      padding: 4px 8px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    button {
      cursor: pointer;
    }
    .btn-orange {
      background: #FF6B00;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      visibility: hidden; opacity: 0; transition: 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-container {
      background: white; width: 90%; max-width: 560px; max-height: 85vh;
      border-radius: 28px; overflow-y: auto; padding: 24px;
    }
    .input-field {
      width: 100%; padding: 12px; border-radius: 16px; border: 1px solid #E5E7EB; margin: 6px 0 12px;
    }
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: #1F2937; color: white; padding: 10px 24px; border-radius: 60px;
      font-size: 0.8rem; z-index: 1100; opacity: 0; transition: 0.2s; pointer-events: none;
    }
    @media (max-width: 780px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); z-index: 30; }
      .sidebar.mobile-open { transform: translateX(0); }
      .content-area { padding: 16px; }
      .flex-row-2 { grid-template-columns: 1fr; }
      .topbar { padding: 12px 16px; }
    }
    .theme-dark {
      background: #0F172A; color: #E2E8F0;
    }
    .theme-dark .sidebar, .theme-dark .stat-card, .theme-dark .info-card, .theme-dark .modal-container, .theme-dark .topbar {
      background: #1E293B; border-color: #334155; color: #E2E8F0;
    }
    .product-img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 12px; background: #F3F4F6; }
    .empty-state { text-align: center; padding: 32px; color: #9CA3AF; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-hashtag"></i></div>
      <div class="logo-text">Kebab <span>Factory</span></div>
    </div>
    <div class="nav-menu" id="navMenu">
      <div class="nav-item active" data-view="dashboard"><i class="fas fa-chart-line"></i><span class="nav-text">Dashboard</span></div>
      <div class="nav-item" data-view="products"><i class="fas fa-utensils"></i><span class="nav-text">Produk</span></div>
      <div class="nav-item" data-view="categories"><i class="fas fa-tags"></i><span class="nav-text">Kategori</span></div>
      <div class="nav-item" data-view="modifiers"><i class="fas fa-sliders-h"></i><span class="nav-text">Modifier</span></div>
      <div class="nav-item" data-view="branding"><i class="fas fa-palette"></i><span class="nav-text">Branding</span></div>
      <div class="nav-item" data-view="users"><i class="fas fa-users"></i><span class="nav-text">User</span></div>
      <div class="nav-item" data-view="settings"><i class="fas fa-cog"></i><span class="nav-text">Pengaturan</span></div>
      <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span class="nav-text">Logout</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="collapse-btn" id="collapseSidebarBtn"><i class="fas fa-bars"></i></button>
        <div class="outlet-info"><h2 id="outletNameDisplay">Kebab Factory Ponorogo</h2><p>Owner Dashboard</p></div>
      </div>
      <div style="display: flex; gap: 12px; align-items:center;">
        <div class="sync-status" id="syncStatusBtn"><span id="onlineDot" class="online-dot"></span><span id="syncText">Online</span></div>
        <div class="sync-status"><i class="fas fa-user-circle"></i> <span id="currentUser">Owner</span></div>
      </div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>
<div id="globalModal" class="modal-overlay"><div class="modal-container" id="modalContent"></div></div>
<div id="toastMsg" class="toast"></div>

<script>
  // ==================== INIT DEFAULT DATA ====================
  let currentView = 'dashboard';
  let darkMode = localStorage.getItem('kf_darkmode') === 'true';
  
  // Default data seeds
  const defaultProducts = [
    { id: 'p1', name: 'Kebab Original', price: 10000, category: 'Signature', desc: 'Daging pilihan + sayur segar', imgUrl: '', active: true },
    { id: 'p2', name: 'Kebab Keju', price: 15000, category: 'Signature', desc: 'Extra keju meleleh', imgUrl: '', active: true },
    { id: 'p3', name: 'Double Telur+Keju', price: 20000, category: 'Double', desc: 'Best value', imgUrl: '', active: true }
  ];
  const defaultCategories = [{ id: 'cat1', name: 'Signature', status: true }, { id: 'cat2', name: 'Double', status: true }];
  const defaultModifiers = [{ id: 'mod1', name: 'Extra Keju', price: 3000 }, { id: 'mod2', name: 'Extra Telur', price: 5000 }, { id: 'mod3', name: 'Extra Saus', price: 1000 }];
  const defaultBranding = { storeName: 'Kebab Factory', logoUrl: '', mascotUrl: '', address: 'Jl. Mlarak - Jabung, Ponorogo', wa: '6281357683151', footerStruk: 'Terima kasih!', instagram: 'kebabfactory', website: '' };
  const defaultUsers = [{ id: 'u1', name: 'Admin Owner', username: 'owner', role: 'Owner', status: true, password: 'owner123' }];
  const defaultSettings = { showLogoOnStruk: true, showMascotOnStruk: true, showQRISOnStruk: true, showWAOnStruk: true, paperSize: '58mm', outletName: 'Kebab Factory Ponorogo', cashierNumber: '001' };
  
  function loadStorage(key, defaults) { const stored = localStorage.getItem(key); return stored ? JSON.parse(stored) : defaults; }
  function saveStorage(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
  
  let products = loadStorage('kf_products', defaultProducts);
  let categories = loadStorage('kf_categories', defaultCategories);
  let modifiers = loadStorage('kf_modifiers', defaultModifiers);
  let branding = loadStorage('kf_branding', defaultBranding);
  let users = loadStorage('kf_users', defaultUsers);
  let settings = loadStorage('kf_settings', defaultSettings);
  let transactions = loadStorage('kf_transactions', []);   // untuk dashboard transaksi
  
  // helper dummy transaksi untuk demo
  if(transactions.length === 0){
    const today = new Date().toISOString().slice(0,10);
    transactions = [{ orderId:'KF-001', date:today, total:45000, status:'Selesai', items:[] }];
    saveStorage('kf_transactions', transactions);
  }
  
  // function show toast
  function showToast(msg, isError=false){ let t=document.getElementById('toastMsg'); t.textContent=msg; t.style.opacity='1'; t.style.background=isError?'#EF4444':'#1F2937'; setTimeout(()=>t.style.opacity='0',2500); }
  
  // Render functions
  function renderDashboard(){
    const todayTrans = transactions.filter(t => t.date === new Date().toISOString().slice(0,10));
    const omzetHari = todayTrans.reduce((s,t)=>s+t.total,0);
    const monthTrans = transactions.filter(t => t.date.startsWith(new Date().toISOString().slice(0,7))).reduce((s,t)=>s+t.total,0);
    const productActive = products.filter(p=>p.active).length;
    const pendingOrders = transactions.filter(t=>t.status!=='Selesai').length;
    // produk terlaris (simulasi dari items)
    let productSales = {};
    transactions.forEach(tx => { if(tx.items) tx.items.forEach(it => { productSales[it.name] = (productSales[it.name]||0)+ (it.qty||1); })});
    const bestSeller = Object.entries(productSales).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const recentTx = [...transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    return `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-title">Omzet Hari Ini</div><div class="stat-value">Rp ${omzetHari.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-title">Omzet Bulan Ini</div><div class="stat-value">Rp ${monthTrans.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-title">Jumlah Transaksi</div><div class="stat-value">${transactions.length}</div></div>
        <div class="stat-card"><div class="stat-title">Produk Aktif</div><div class="stat-value">${productActive}</div></div>
        <div class="stat-card"><div class="stat-title">User Aktif</div><div class="stat-value">${users.filter(u=>u.status).length}</div></div>
        <div class="stat-card"><div class="stat-title">Order Pending</div><div class="stat-value">${pendingOrders}</div></div>
      </div>
      <div class="flex-row-2">
        <div class="info-card"><h3>🏆 Produk Terlaris</h3>${bestSeller.length? bestSeller.map(b=>`<div>• ${b[0]} (${b[1]}x)</div>`).join(''):'<div class="empty-state">Belum ada data</div>'}</div>
        <div class="info-card"><h3>📋 Transaksi Terbaru</h3>${recentTx.map(t=>`<div style="display:flex; justify-content:space-between;"><span>${t.orderId}</span><span>Rp ${t.total.toLocaleString()}</span></div>`).join('')||'<div class="empty-state">Kosong</div>'}</div>
        <div class="info-card"><h3>🔄 Status Sinkronisasi</h3><div>Google Sheets: <span style="color:#10B981;">Siap migrasi</span><br>Data lokal tersimpan. Saat online tekan Sync untuk kirim ke Apps Script.</div></div>
      </div>
    `;
  }
  
  // tabel produk
  function renderProducts(){
    let html = `<div style="display:flex; justify-content:space-between; margin-bottom:20px;"><h2>Manajemen Produk</h2><button class="btn-orange" onclick="openProductModal()">+ Tambah Produk</button></div>
    <input type="text" id="searchProduct" placeholder="Cari produk..." class="input-field" style="margin-bottom:16px;"><div style="overflow-x:auto;"><table width="100%"><thead><tr><th>Foto</th><th>Nama</th><th>Harga</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="productTableBody"></tbody></table></div>`;
    return html;
  }
  function refreshProductTable(){
    const search = document.getElementById('searchProduct')?.value.toLowerCase() || '';
    let filtered = products.filter(p=> p.name.toLowerCase().includes(search));
    const tbody = document.getElementById('productTableBody');
    if(tbody) tbody.innerHTML = filtered.map(p => `<tr><td><img src="${p.imgUrl||'https://placehold.co/40x40'}" class="product-img-preview" onerror="this.src='https://placehold.co/40x40'"></td><td>${p.name}</td><td>Rp ${p.price.toLocaleString()}</td><td>${p.category}</td><td><span class="badge">${p.active?'Aktif':'Nonaktif'}</span></td><td><button class="btn-orange" style="background:#6B7280;" onclick="editProduct('${p.id}')">Edit</button> <button style="background:#EF4444; border:none; padding:6px 12px; border-radius:40px; color:white;" onclick="deleteProduct('${p.id}')">Hapus</button></td></tr>`).join('');
  }
  window.openProductModal = ()=>{
    const catOptions = categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
    document.getElementById('modalContent').innerHTML = `<h3>Tambah Produk</h3><input id="prodName" placeholder="Nama Produk" class="input-field"><input id="prodPrice" type="number" placeholder="Harga" class="input-field"><select id="prodCategory" class="input-field">${catOptions}</select><textarea id="prodDesc" placeholder="Deskripsi" class="input-field"></textarea><input id="prodImg" placeholder="URL Foto" class="input-field"><label><input type="checkbox" id="prodActive" checked> Aktif</label><div style="display:flex; gap:12px; margin-top:20px;"><button class="btn-orange" id="saveProductBtn">Simpan</button><button class="btn-orange" style="background:#9CA3AF;" onclick="closeModal()">Batal</button></div>`;
    document.getElementById('globalModal').classList.add('active');
    document.getElementById('saveProductBtn').onclick = ()=>{
      const newProd = { id: 'p'+Date.now(), name: document.getElementById('prodName').value, price: parseInt(document.getElementById('prodPrice').value), category: document.getElementById('prodCategory').value, desc: document.getElementById('prodDesc').value, imgUrl: document.getElementById('prodImg').value, active: document.getElementById('prodActive').checked };
      if(!newProd.name) return showToast('Nama produk wajib');
      products.push(newProd); saveStorage('kf_products', products); closeModal(); renderView('products');
    };
  };
  window.editProduct = (id)=>{
    const prod = products.find(p=>p.id===id);
    const catOptions = categories.map(c=>`<option value="${c.name}" ${c.name===prod.category?'selected':''}>${c.name}</option>`).join('');
    document.getElementById('modalContent').innerHTML = `<h3>Edit Produk</h3><input id="prodName" value="${prod.name}" class="input-field"><input id="prodPrice" value="${prod.price}" type="number" class="input-field"><select id="prodCategory" class="input-field">${catOptions}</select><textarea id="prodDesc" class="input-field">${prod.desc||''}</textarea><input id="prodImg" value="${prod.imgUrl||''}" placeholder="URL Foto" class="input-field"><label><input type="checkbox" id="prodActive" ${prod.active?'checked':''}> Aktif</label><div style="display:flex; gap:12px; margin-top:20px;"><button class="btn-orange" id="updateProdBtn">Update</button><button class="btn-orange" style="background:#9CA3AF;" onclick="closeModal()">Batal</button></div>`;
    document.getElementById('globalModal').classList.add('active');
    document.getElementById('updateProdBtn').onclick = ()=>{ prod.name = document.getElementById('prodName').value; prod.price = parseInt(document.getElementById('prodPrice').value); prod.category = document.getElementById('prodCategory').value; prod.desc = document.getElementById('prodDesc').value; prod.imgUrl = document.getElementById('prodImg').value; prod.active = document.getElementById('prodActive').checked; saveStorage('kf_products', products); closeModal(); renderView('products'); showToast('Produk diperbarui'); };
  };
  window.deleteProduct = (id)=>{ if(confirm('Hapus produk?')){ products = products.filter(p=>p.id!==id); saveStorage('kf_products', products); renderView('products'); } };
  
  // Kategori CRUD
  function renderCategories(){ return `<div style="margin-bottom:20px;"><button class="btn-orange" onclick="openCategoryModal()">+ Kategori Baru</button></div><table width="100%"><thead><tr><th>Nama Kategori</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${categories.map(c=>`<tr><td>${c.name}</td><td><span class="badge">${c.status?'Aktif':'Tidak'}</span></td><td><button onclick="editCategory('${c.id}')" class="btn-orange" style="background:#6B7280;">Edit</button> <button onclick="deleteCategory('${c.id}')" style="background:#EF4444;border:none;border-radius:40px;padding:6px 12px;">Hapus</button></td></tr>`).join('')}</tbody></table>`; }
  window.openCategoryModal = ()=>{ document.getElementById('modalContent').innerHTML = `<h3>Tambah Kategori</h3><input id="catName" placeholder="Nama Kategori" class="input-field"><label><input type="checkbox" id="catStatus" checked> Aktif</label><div><button class="btn-orange" id="saveCatBtn">Simpan</button><button class="btn-orange" style="background:#9CA3AF;" onclick="closeModal()">Batal</button></div>`; document.getElementById('globalModal').classList.add('active'); document.getElementById('saveCatBtn').onclick = ()=>{ let n = document.getElementById('catName').value; if(!n) return; categories.push({id:'cat'+Date.now(), name:n, status:document.getElementById('catStatus').checked}); saveStorage('kf_categories', categories); closeModal(); renderView('categories'); }; };
  window.editCategory = (id)=>{ let cat = categories.find(c=>c.id===id); document.getElementById('modalContent').innerHTML = `<h3>Edit Kategori</h3><input id="catName" value="${cat.name}" class="input-field"><label><input type="checkbox" id="catStatus" ${cat.status?'checked':''}> Aktif</label><div><button class="btn-orange" id="editCatBtn">Update</button><button class="btn-orange" style="background:#9CA3AF;" onclick="closeModal()">Batal</button></div>`; document.getElementById('globalModal').classList.add('active'); document.getElementById('editCatBtn').onclick = ()=>{ cat.name = document.getElementById('catName').value; cat.status = document.getElementById('catStatus').checked; saveStorage('kf_categories', categories); closeModal(); renderView('categories'); }; };
  window.deleteCategory = (id)=>{ categories = categories.filter(c=>c.id!==id); saveStorage('kf_categories', categories); renderView('categories'); };
  
  // Modifier CRUD
  function renderModifiers(){ return `<div><button class="btn-orange" onclick="openModifierModal()">+ Tambah Modifier</button></div><table width="100%"><thead><tr><th>Nama</th><th>Harga</th><th>Aksi</th></tr></thead><tbody>${modifiers.map(m=>`<tr><td>${m.name}</td><td>Rp ${m.price.toLocaleString()}</td><td><button onclick="editModifier('${m.id}')">Edit</button> <button onclick="deleteModifier('${m.id}')">Hapus</button></td></tr>`).join('')}</tbody></table>`; }
  window.openModifierModal = ()=>{ document.getElementById('modalContent').innerHTML = `<h3>Tambah Modifier</h3><input id="modName" placeholder="Nama (Extra Keju)" class="input-field"><input id="modPrice" type="number" placeholder="Harga" class="input-field"><div><button class="btn-orange" id="saveModBtn">Simpan</button><button onclick="closeModal()">Batal</button></div>`; document.getElementById('globalModal').classList.add('active'); document.getElementById('saveModBtn').onclick = ()=>{ let nm=document.getElementById('modName').value, pr=parseInt(document.getElementById('modPrice').value); if(nm){ modifiers.push({id:'mod'+Date.now(), name:nm, price:pr}); saveStorage('kf_modifiers', modifiers); closeModal(); renderView('modifiers'); } }; };
  window.editModifier = (id)=>{ let mod = modifiers.find(m=>m.id===id); document.getElementById('modalContent').innerHTML = `<h3>Edit Modifier</h3><input id="modName" value="${mod.name}" class="input-field"><input id="modPrice" value="${mod.price}" class="input-field"><div><button class="btn-orange" id="upModBtn">Update</button><button onclick="closeModal()">Batal</button></div>`; document.getElementById('globalModal').classList.add('active'); document.getElementById('upModBtn').onclick = ()=>{ mod.name=document.getElementById('modName').value; mod.price=parseInt(document.getElementById('modPrice').value); saveStorage('kf_modifiers', modifiers); closeModal(); renderView('modifiers'); }; };
  window.deleteModifier = (id)=>{ modifiers=modifiers.filter(m=>m.id!==id); saveStorage('kf_modifiers', modifiers); renderView('modifiers'); };
  
  // Branding + Preview Struk
  function renderBranding(){
    return `<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;"><div><h3>Informasi Toko</h3><label>Nama Toko</label><input id="brandStore" value="${branding.storeName}" class="input-field"><label>Logo URL</label><input id="brandLogo" value="${branding.logoUrl}" class="input-field"><label>Maskot URL</label><input id="brandMascot" value="${branding.mascotUrl}" class="input-field"><label>Alamat</label><textarea id="brandAddress" class="input-field">${branding.address}</textarea><label>WhatsApp</label><input id="brandWa" value="${branding.wa}" class="input-field"><label>Footer Struk</label><input id="brandFooter" value="${branding.footerStruk}" class="input-field"><label>Instagram</label><input id="brandIg" value="${branding.instagram}" class="input-field"><button class="btn-orange" onclick="saveBranding()">Simpan Branding</button></div><div><h3>Preview Struk (${settings.paperSize})</h3><div id="strukPreview" style="background:white; color:black; padding:16px; border-radius:16px; font-family:monospace; font-size:12px; max-width:300px;"></div></div></div>`;
  }
  function updatePreviewStruk(){
    const paper = settings.paperSize;
    const previewDiv = document.getElementById('strukPreview');
    if(!previewDiv) return;
    previewDiv.innerHTML = `<div style="text-align:center;">${branding.logoUrl?'<img src="'+branding.logoUrl+'" style="max-width:80px;">':''}<h3>${branding.storeName}</h3>${branding.mascotUrl?'<img src="'+branding.mascotUrl+'" style="width:40px;">':''}<p>${branding.address}</p><p>WA: ${branding.wa}</p><hr><div>Item Demo x1 = Rp 15.000</div><hr><strong>Total: Rp 15.000</strong><p>${branding.footerStruk}</p>${settings.showQRISOnStruk?'<div>[QRIS PLACEHOLDER]</div>':''}</div>`;
  }
  window.saveBranding = ()=>{ branding.storeName=document.getElementById('brandStore').value; branding.logoUrl=document.getElementById('brandLogo').value; branding.mascotUrl=document.getElementById('brandMascot').value; branding.address=document.getElementById('brandAddress').value; branding.wa=document.getElementById('brandWa').value; branding.footerStruk=document.getElementById('brandFooter').value; branding.instagram=document.getElementById('brandIg').value; saveStorage('kf_branding',branding); updatePreviewStruk(); showToast('Branding disimpan'); };
  
  // User management
  function renderUsers(){ return `<div><button class="btn-orange" onclick="openUserModal()">+ Tambah User</button></div><table><thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${users.map(u=>`<tr><td>${u.name}</td><td>${u.username}</td><td>${u.role}</td><td>${u.status?'Aktif':'Nonaktif'}</td><td><button onclick="editUser('${u.id}')">Edit</button> <button onclick="deleteUser('${u.id}')">Hapus</button></td></tr>`).join('')}</tbody></table>`; }
  window.openUserModal = ()=>{ document.getElementById('modalContent').innerHTML = `<h3>Tambah User</h3><input id="userName" placeholder="Nama" class="input-field"><input id="userUsername" placeholder="Username" class="input-field"><input id="userPass" type="password" placeholder="Password" class="input-field"><select id="userRole" class="input-field"><option>Owner</option><option>Manager</option><option>Kasir</option><option>Kitchen</option></select><label><input type="checkbox" id="userStatus" checked> Aktif</label><div><button class="btn-orange" id="saveUserBtn">Simpan</button></div>`; document.getElementById('globalModal').classList.add('active'); document.getElementById('saveUserBtn').onclick = ()=>{ users.push({id:'u'+Date.now(), name:document.getElementById('userName').value, username:document.getElementById('userUsername').value, password:document.getElementById('userPass').value, role:document.getElementById('userRole').value, status:document.getElementById('userStatus').checked}); saveStorage('kf_users', users); closeModal(); renderView('users'); }; };
  window.editUser = (id)=>{ let u = users.find(u=>u.id===id); document.getElementById('modalContent').innerHTML = `<h3>Edit User</h3><input id="userName" value="${u.name}" class="input-field"><input id="userUsername" value="${u.username}" class="input-field"><select id="userRole" class="input-field"><option ${u.role==='Owner'?'selected':''}>Owner</option><option ${u.role==='Manager'?'selected':''}>Manager</option><option ${u.role==='Kasir'?'selected':''}>Kasir</option><option ${u.role==='Kitchen'?'selected':''}>Kitchen</option></select><label><input type="checkbox" id="userStatus" ${u.status?'checked':''}> Aktif</label><div><button class="btn-orange" id="updateUserBtn">Update</button></div>`; document.getElementById('globalModal').classList.add('active'); document.getElementById('updateUserBtn').onclick = ()=>{ u.name=document.getElementById('userName').value; u.role=document.getElementById('userRole').value; u.status=document.getElementById('userStatus').checked; saveStorage('kf_users', users); closeModal(); renderView('users'); }; };
  window.deleteUser = (id)=>{ users=users.filter(u=>u.id!==id); saveStorage('kf_users', users); renderView('users'); };
  
  // Pengaturan
  function renderSettings(){
    return `<div><label><input type="checkbox" id="setLogoStruk" ${settings.showLogoOnStruk?'checked':''}> Tampilkan Logo di Struk</label><br><label><input type="checkbox" id="setMascotStruk" ${settings.showMascotOnStruk?'checked':''}> Tampilkan Maskot</label><br><label><input type="checkbox" id="setQRISStruk" ${settings.showQRISOnStruk?'checked':''}> QRIS di Struk</label><br><label><input type="checkbox" id="setWAStruk" ${settings.showWAOnStruk?'checked':''}> WA di Struk</label><br><label>Ukuran Kertas: <select id="paperSize"><option ${settings.paperSize==='58mm'?'selected':''}>58mm</option><option ${settings.paperSize==='80mm'?'selected':''}>80mm</option></select></label><br><label>Nama Outlet: <input id="outletNameSetting" value="${settings.outletName}" class="input-field"></label><button class="btn-orange" onclick="saveSettings()">Simpan Pengaturan</button></div>`;
  }
  window.saveSettings = ()=>{ settings.showLogoOnStruk = document.getElementById('setLogoStruk').checked; settings.showMascotOnStruk = document.getElementById('setMascotStruk').checked; settings.showQRISOnStruk = document.getElementById('setQRISStruk').checked; settings.showWAOnStruk = document.getElementById('setWAStruk').checked; settings.paperSize = document.getElementById('paperSize').value; settings.outletName = document.getElementById('outletNameSetting').value; saveStorage('kf_settings', settings); document.getElementById('outletNameDisplay').innerText = settings.outletName; showToast('Pengaturan disimpan'); };
  
  function closeModal(){ document.getElementById('globalModal').classList.remove('active'); }
  window.closeModal = closeModal;
  function renderView(view){
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelector(`.nav-item[data-view="${view}"]`)?.classList.add('active');
    let html = '';
    if(view === 'dashboard') html = renderDashboard();
    if(view === 'products') html = renderProducts();
    if(view === 'categories') html = renderCategories();
    if(view === 'modifiers') html = renderModifiers();
    if(view === 'branding') html = renderBranding();
    if(view === 'users') html = renderUsers();
    if(view === 'settings') html = renderSettings();
    document.getElementById('contentArea').innerHTML = html;
    if(view === 'products') refreshProductTable();
    if(view === 'branding') setTimeout(()=> updatePreviewStruk(), 50);
    if(view === 'settings') document.getElementById('outletNameDisplay').innerText = settings.outletName;
  }
  
  // toggle sidebar collapse
  let collapsed = false;
  document.getElementById('collapseSidebarBtn').onclick = ()=>{ document.querySelector('.sidebar').classList.toggle('sidebar-collapsed'); collapsed = !collapsed; };
  document.querySelectorAll('.nav-item').forEach(item=>{ if(item.dataset.view) item.addEventListener('click',()=>{ renderView(item.dataset.view); if(window.innerWidth<=780) document.querySelector('.sidebar').classList.remove('mobile-open'); }); });
  document.getElementById('logoutBtn')?.addEventListener('click',()=>{ showToast('Logout simulasi'); });
  document.getElementById('syncStatusBtn').onclick = ()=>{ showToast('Siap sinkron ke Google Sheets (migrasi via Apps Script)'); };
  // init
  renderView('dashboard');
  if(darkMode) document.body.classList.add('theme-dark');
  window.addEventListener('resize',()=>{ if(window.innerWidth>780) document.querySelector('.sidebar').classList.remove('mobile-open'); });
</script>
</body>
</html>
