<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KF Kitchen — Dapur Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fire:    #ea580c;
      --ember:   #f97316;
      --coal:    #1a0f00;
      --smoke:   #2d1a0a;
      --ash:     #4a3728;
      --cream:   #fef3e2;
      --paper:   #fff8f0;
      --new:     #ff4500;
      --process: #f59e0b;
      --ready:   #22c55e;
      --done:    #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--coal);
      color: var(--cream);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
      opacity: 0.6;
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--coal);
      z-index: 999;
      flex-direction: column;
      gap: 2rem;
      padding: 2rem;
    }

    .login-box {
      background: var(--smoke);
      border: 1px solid var(--ash);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 360px;
      text-align: center;
    }

    .login-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ember);
      margin-bottom: 0.25rem;
      letter-spacing: -0.5px;
    }

    .login-sub {
      font-size: 0.7rem;
      color: var(--ash);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .login-input {
      width: 100%;
      background: var(--coal);
      border: 1.5px solid var(--ash);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      color: var(--cream);
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--fire); }

    .login-btn {
      width: 100%;
      background: var(--fire);
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.875rem;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: var(--ember); }

    .login-error {
      color: #ef4444;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* ── MAIN APP ── */
    #app { display: none; position: relative; z-index: 1; }

    /* ── HEADER ── */
    .header {
      background: var(--smoke);
      border-bottom: 1px solid var(--ash);
      padding: 1rem 1.25rem;
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
    }

    .header-left { display: flex; align-items: center; gap: 0.875rem; }

    .header-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--ember);
      letter-spacing: -0.5px;
    }

    .header-badge {
      background: var(--fire);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
      letter-spacing: 1px;
    }

    .header-right { display: flex; align-items: center; gap: 0.75rem; }

    /* Live indicator */
    .live-dot {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.7rem; color: #22c55e;
      letter-spacing: 1px;
    }
    .live-dot::before {
      content: '';
      width: 7px; height: 7px;
      background: #22c55e;
      border-radius: 50%;
      animation: livePulse 1.5s infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Sound toggle */
    .sound-btn {
      background: var(--ash);
      border: none; border-radius: 0.5rem;
      padding: 0.4rem 0.75rem;
      color: var(--cream);
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      transition: background 0.2s;
    }
    .sound-btn:hover { background: var(--fire); }

    /* Logout */
    .logout-btn {
      background: none; border: 1px solid var(--ash);
      border-radius: 0.5rem; padding: 0.4rem 0.75rem;
      color: var(--ash); font-size: 0.7rem;
      cursor: pointer; font-family: 'Space Mono', monospace;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* ── STATS BAR ── */
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem; padding: 1rem 1.25rem;
      background: var(--smoke);
      border-bottom: 1px solid var(--ash);
    }

    .stat-item {
      text-align: center;
      padding: 0.625rem 0.5rem;
      border-radius: 0.75rem;
      background: var(--coal);
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.6rem;
      color: var(--ash);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .stat-new .stat-num    { color: var(--new); }
    .stat-proc .stat-num   { color: var(--process); }
    .stat-ready .stat-num  { color: var(--ready); }
    .stat-done .stat-num   { color: var(--done); }

    /* ── FILTER TABS ── */
    .filter-tabs {
      display: flex; gap: 0.5rem;
      padding: 1rem 1.25rem 0;
      overflow-x: auto;
    }

    .tab-btn {
      background: var(--smoke);
      border: 1.5px solid var(--ash);
      border-radius: 2rem;
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      font-family: 'Space Mono', monospace;
      color: var(--ash);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--fire);
      border-color: var(--fire);
      color: white;
    }

    /* ── ORDER GRID ── */
    .order-grid {
      padding: 1rem 1.25rem 6rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    /* ── ORDER CARD ── */
    .order-card {
      background: var(--smoke);
      border: 1.5px solid var(--ash);
      border-radius: 1.25rem;
      overflow: hidden;
      animation: cardIn 0.3s ease;
      transition: transform 0.2s;
    }
    .order-card:hover { transform: translateY(-2px); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Status accent line on top */
    .card-accent {
      height: 4px;
    }
    .accent-Baru     { background: var(--new); }
    .accent-Diproses { background: var(--process); }
    .accent-Siap     { background: var(--ready); }
    .accent-Selesai  { background: var(--done); }

    .card-header {
      padding: 0.875rem 1rem 0.625rem;
      display: flex; justify-content: space-between; align-items: flex-start;
    }

    .card-orderid {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--ember);
      letter-spacing: 1px;
    }

    .card-time {
      font-size: 0.65rem;
      color: var(--ash);
      margin-top: 0.15rem;
    }

    .status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.25rem 0.625rem;
      border-radius: 2rem;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .badge-Baru     { background: rgba(255,69,0,0.2);   color: #ff6b35; border: 1px solid rgba(255,69,0,0.3); }
    .badge-Diproses { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .badge-Siap     { background: rgba(34,197,94,0.2);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .badge-Selesai  { background: rgba(107,114,128,0.2);color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }

    .card-customer {
      padding: 0 1rem 0.625rem;
      font-size: 0.85rem;
      color: var(--cream);
      font-weight: 700;
    }

    /* Delivery/Pickup chip */
    .delivery-chip {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.65rem;
      padding: 0.2rem 0.625rem;
      border-radius: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .chip-delivery { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .chip-pickup   { background: rgba(168,85,247,0.2); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }

    .card-divider {
      height: 1px; background: var(--ash);
      margin: 0 1rem 0.625rem;
    }

    /* Items list */
    .card-items {
      padding: 0 1rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      margin-bottom: 0.75rem;
    }

    .item-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 0.5rem;
    }

    .item-name {
      font-size: 0.78rem;
      color: var(--cream);
      line-height: 1.4;
      flex: 1;
    }

    .item-qty {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--ember);
      flex-shrink: 0;
    }

    .item-tags {
      display: flex; gap: 0.3rem; flex-wrap: wrap;
      margin-top: 0.2rem;
    }

    .item-tag {
      font-size: 0.6rem;
      padding: 0.1rem 0.4rem;
      border-radius: 0.3rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .tag-daging { background: rgba(234,88,12,0.25); color: #fb923c; }
    .tag-varian { background: rgba(34,197,94,0.15);  color: #4ade80; }
    .tag-note   { background: rgba(250,204,21,0.15); color: #fde047; }

    /* Card footer */
    .card-footer {
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.2);
      display: flex; gap: 0.5rem; align-items: center;
    }

    /* Action buttons */
    .action-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border: none; border-radius: 0.625rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .btn-next {
      background: var(--fire);
      color: white;
    }
    .btn-next:hover { background: var(--ember); transform: scale(1.02); }

    .btn-maps {
      background: rgba(59,130,246,0.2);
      color: #60a5fa;
      border: 1px solid rgba(59,130,246,0.3) !important;
      flex: 0 0 auto;
      padding: 0.6rem 0.75rem;
    }
    .btn-maps:hover { background: rgba(59,130,246,0.35); }

    .btn-done {
      background: rgba(107,114,128,0.2);
      color: #9ca3af;
    }
    .btn-done:hover { background: rgba(107,114,128,0.35); }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--ash);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-text { font-family: 'Syne', sans-serif; font-size: 1rem; }
    .empty-sub  { font-size: 0.7rem; margin-top: 0.5rem; letter-spacing: 1px; }

    /* ── NEW ORDER ALERT BANNER ── */
    #new-order-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: var(--new);
      color: white;
      text-align: center;
      padding: 0.875rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      z-index: 50;
      transform: translateY(-100%);
      transition: transform 0.4s ease;
    }
    #new-order-banner.show { transform: translateY(0); }

    /* ── REFRESH INDICATOR ── */
    .refresh-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--smoke);
      border-top: 1px solid var(--ash);
      padding: 0.75rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10;
    }

    .refresh-countdown {
      font-size: 0.7rem; color: var(--ash);
      letter-spacing: 1px;
    }

    .refresh-progress {
      width: 100px; height: 3px;
      background: var(--ash);
      border-radius: 2px;
      overflow: hidden;
    }

    .refresh-fill {
      height: 100%;
      background: var(--fire);
      border-radius: 2px;
      transition: width 1s linear;
    }

    .manual-refresh {
      background: none; border: 1px solid var(--ash);
      color: var(--ash); border-radius: 0.5rem;
      padding: 0.3rem 0.75rem; font-size: 0.7rem;
      cursor: pointer; font-family: 'Space Mono', monospace;
      transition: all 0.2s;
    }
    .manual-refresh:hover { border-color: var(--fire); color: var(--fire); }

    /* Payment badge */
    .payment-badge {
      font-size: 0.6rem; font-weight: 700;
      padding: 0.15rem 0.5rem; border-radius: 0.3rem;
    }
    .pay-cash { background: rgba(34,197,94,0.2); color: #4ade80; }
    .pay-qris { background: rgba(139,92,246,0.2); color: #a78bfa; }

    /* Total chip */
    .total-chip {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--ember);
    }

    /* ── MOBILE TWEAKS ── */
    @media (max-width: 480px) {
      .stats-bar { grid-template-columns: repeat(4, 1fr); gap: 0.35rem; }
      .stat-num  { font-size: 1.25rem; }
      .order-grid { grid-template-columns: 1fr; padding: 0.875rem 0.875rem 5rem; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
  ============================================================ -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo">🔥 KF Kitchen</div>
      <div class="login-sub">Dapur Dashboard</div>

      <input type="password" id="pin-input" class="login-input"
        placeholder="••••••"
        onkeydown="if(event.key==='Enter') doLogin()"
        maxlength="12">

      <button class="login-btn" onclick="doLogin()">MASUK</button>
      <p class="login-error" id="login-error">❌ PIN salah. Coba lagi.</p>
    </div>
    <p style="font-size:0.65rem;color:#4a3728;letter-spacing:1px">THE KEBAB FACTORY © 2026</p>
  </div>

  <!-- ============================================================
       MAIN APP
  ============================================================ -->
  <div id="app">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div>
          <div class="header-logo">🔥 KF Kitchen</div>
        </div>
        <span class="header-badge" id="active-count">0 aktif</span>
      </div>
      <div class="header-right">
        <div class="live-dot">LIVE</div>
        <button class="sound-btn" onclick="toggleSound()" id="sound-btn">🔔 ON</button>
        <button class="logout-btn" onclick="doLogout()">KELUAR</button>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item stat-new">
        <div class="stat-num" id="stat-baru">0</div>
        <div class="stat-label">Baru</div>
      </div>
      <div class="stat-item stat-proc">
        <div class="stat-num" id="stat-diproses">0</div>
        <div class="stat-label">Diproses</div>
      </div>
      <div class="stat-item stat-ready">
        <div class="stat-num" id="stat-siap">0</div>
        <div class="stat-label">Siap</div>
      </div>
      <div class="stat-item stat-done">
        <div class="stat-num" id="stat-selesai">0</div>
        <div class="stat-label">Selesai</div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setFilter('Semua', this)">🍽 Semua</button>
      <button class="tab-btn" onclick="setFilter('Baru', this)">🆕 Baru</button>
      <button class="tab-btn" onclick="setFilter('Diproses', this)">🔥 Diproses</button>
      <button class="tab-btn" onclick="setFilter('Siap', this)">✅ Siap</button>
      <button class="tab-btn" onclick="setFilter('Selesai', this)">📦 Selesai</button>
      <button class="tab-btn" onclick="setFilter('Delivery', this)">🛵 Delivery</button>
      <button class="tab-btn" onclick="setFilter('Pickup', this)">🏪 Pickup</button>
    </div>

    <!-- Order Grid -->
    <div class="order-grid" id="order-grid">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-text">Memuat pesanan...</div>
        <div class="empty-sub">Menghubungi server</div>
      </div>
    </div>

    <!-- New Order Banner -->
    <div id="new-order-banner">🔔 ADA PESANAN BARU MASUK!</div>

    <!-- Refresh Bar -->
    <div class="refresh-bar">
      <span class="refresh-countdown" id="countdown-text">Refresh dalam 20s</span>
      <div class="refresh-progress">
        <div class="refresh-fill" id="refresh-fill" style="width:100%"></div>
      </div>
      <button class="manual-refresh" onclick="fetchOrders()">↺ Refresh</button>
    </div>

  </div>

  <script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_p4L2kJFZEciZHpG5cyXDM1wnzB6i0nE5u9p42P08uytzTHBV9etoXp-pgz65NohEkg/exec';
    const DAPUR_PIN       = 'kf2026';        // ← Ganti PIN di sini
    const REFRESH_INTERVAL = 20;             // detik

    // ============================================================
    // STATE
    // ============================================================
    let allOrders       = [];
    let activeFilter    = 'Semua';
    let soundEnabled    = true;
    let refreshTimer    = null;
    let countdownVal    = REFRESH_INTERVAL;
    let knownOrderIds   = new Set();
    let isFirstLoad     = true;

    // ============================================================
    // LOGIN
    // ============================================================
    function doLogin() {
      const pin = document.getElementById('pin-input').value.trim();
      if (pin === DAPUR_PIN) {
        localStorage.setItem('kf_dapur_auth', btoa(pin + '_' + Date.now()));
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        startApp();
      } else {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
        setTimeout(() => {
          document.getElementById('login-error').style.display = 'none';
        }, 3000);
      }
    }

    function doLogout() {
      localStorage.removeItem('kf_dapur_auth');
      location.reload();
    }

    // Auto-login jika sudah ada sesi (max 12 jam)
    function checkAutoLogin() {
      const stored = localStorage.getItem('kf_dapur_auth');
      if (stored) {
        try {
          const decoded  = atob(stored);
          const parts    = decoded.split('_');
          const ts       = parseInt(parts[parts.length - 1]);
          if (Date.now() - ts < 12 * 60 * 60 * 1000) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            startApp();
            return;
          }
        } catch(e) {}
        localStorage.removeItem('kf_dapur_auth');
      }
    }

    // ============================================================
    // APP START
    // ============================================================
    function startApp() {
      startCountdown(); // mulai countdown dulu
      fetchOrders();    // fetch langsung (fetchOrders restart countdown setelah selesai)
    }

    // ============================================================
    // FETCH ORDERS dari Google Apps Script
    // ============================================================
    async function fetchOrders() {
      try {
        const res  = await fetch(APPS_SCRIPT_URL + '?action=getAllOrders&t=' + Date.now());
        const text = await res.text();

        let data;
        try { data = JSON.parse(text); }
        catch(e) { throw new Error('Server tidak merespons JSON. Cek Apps Script.'); }

        if (data.orders) {
          const prevIds   = new Set(knownOrderIds);
          const newOrders = [];
          data.orders.forEach(o => {
            if (!prevIds.has(o.orderId) && !isFirstLoad) newOrders.push(o.orderId);
            knownOrderIds.add(o.orderId);
          });
          if (newOrders.length > 0) {
            showNewOrderAlert(newOrders.length);
            if (soundEnabled) playBeep();
          }
          allOrders   = data.orders;
          isFirstLoad = false;
          renderOrders();
          updateStats();
        } else if (data.error) {
          throw new Error('Apps Script: ' + data.error);
        }

      } catch (err) {
        console.error('fetchOrders gagal:', err.message);
        if (allOrders.length === 0) {
          document.getElementById('order-grid').innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <div class="empty-text">Gagal terhubung ke server</div>
              <div class="empty-sub" style="font-size:0.65rem;max-width:260px;text-align:center;line-height:1.8">
                ${err.message}<br>
                Cek: koneksi internet · Apps Script aktif · akses "Anyone"
              </div>
            </div>`;
        }
      }

      startCountdown();
    }

    // ============================================================
    // UPDATE STATUS ORDER ke Google Sheet
    // ============================================================
    async function updateStatus(orderId, newStatus) {
      // Update UI dulu (optimistic update)
      const order = allOrders.find(o => o.orderId === orderId);
      if (order) order.status = newStatus;
      renderOrders();
      updateStats();

      try {
        const payload = new URLSearchParams();
        payload.append('action',  'updateStatus');
        payload.append('orderId', orderId);
        payload.append('status',  newStatus);

        await fetch(APPS_SCRIPT_URL, {
          method:  'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body:    payload
        });
      } catch (err) {
        console.warn('Status update failed:', err);
      }
    }

    // ============================================================
    // RENDER
    // ============================================================
    function renderOrders() {
      const grid = document.getElementById('order-grid');
      let filtered = [...allOrders];

      // Filter aktif
      if (activeFilter === 'Delivery') {
        filtered = filtered.filter(o => o.pengiriman && o.pengiriman.toLowerCase().includes('delivery'));
      } else if (activeFilter === 'Pickup') {
        filtered = filtered.filter(o => o.pengiriman && (o.pengiriman.toLowerCase().includes('ambil') || o.pengiriman.toLowerCase().includes('pickup')));
      } else if (activeFilter !== 'Semua') {
        filtered = filtered.filter(o => o.status === activeFilter);
      }

      // Urut: Baru dulu, lalu Diproses, lalu Siap, lalu Selesai
      const statusOrder = { 'Baru': 0, 'Diproses': 1, 'Siap': 2, 'Selesai': 3, 'Batal': 4 };
      filtered.sort((a, b) => (statusOrder[a.status] ?? 9) - (statusOrder[b.status] ?? 9));

      // Update active count badge
      const activeCount = allOrders.filter(o => o.status !== 'Selesai' && o.status !== 'Batal').length;
      document.getElementById('active-count').textContent = activeCount + ' aktif';

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🫙</div>
            <div class="empty-text">Tidak ada pesanan</div>
            <div class="empty-sub">${activeFilter === 'Semua' ? 'Belum ada order masuk' : 'Filter: ' + activeFilter}</div>
          </div>`;
        return;
      }

      try {
        grid.innerHTML = filtered.map(order => buildCard(order)).join('');
      } catch(e) {
        console.error('buildCard error:', e);
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🐛</div><div class="empty-text">Error render kartu</div><div class="empty-sub" style="max-width:280px;text-align:center;line-height:1.8">' + e.message + '</div></div>';
      }
    }

    function buildCard(order) {
      const isDelivery  = order.pengiriman && String(order.pengiriman).toLowerCase().includes('delivery');
      const chipClass   = isDelivery ? 'chip-delivery' : 'chip-pickup';
      const chipLabel   = isDelivery ? '🛵 Delivery' : '🏪 Pickup';
      const payClass    = order.pembayaran && String(order.pembayaran).toLowerCase().includes('qris') ? 'pay-qris' : 'pay-cash';
      const payLabel    = order.pembayaran || 'Cash';

      // Parse items string → array
      // Format: "Kebab Original(Ayam·Pedas)x2, Kebab Telur(Sapi·Tidak Pedas)x1"
      const itemsHtml   = parseItems(order.items || '');

      // Tombol aksi berdasarkan status
      const nextLabel   = { 'Baru': '🔥 Proses Sekarang', 'Diproses': '✅ Tandai Siap', 'Siap': '📦 Selesai', 'Selesai': '' }[order.status] || '';
      const nextStatus  = { 'Baru': 'Diproses', 'Diproses': 'Siap', 'Siap': 'Selesai' }[order.status] || '';

      // Tombol GPS hanya jika delivery + ada koordinat
      const hasGps      = isDelivery && order.userLat && order.userLng;
      const mapsUrl     = hasGps ? `https://maps.google.com?q=${order.userLat},${order.userLng}` : null;

      return `
        <div class="order-card" id="card-${order.orderId}">
          <div class="card-accent accent-${order.status}"></div>

          <div class="card-header">
            <div>
              <div class="card-orderid">${order.orderId}</div>
              <div class="card-time">${order.timestamp || ''}</div>
            </div>
            <span class="status-badge badge-${order.status}">${order.status || 'Baru'}</span>
          </div>

          <div class="card-customer">
            👤 ${order.nama || '-'}
            ${order.noWA ? `<a href="https://wa.me/${String(order.noWA).replace(/\D/g,'')}" target="_blank"
              style="color:#4ade80;font-size:0.7rem;margin-left:0.5rem;text-decoration:none">💬 WA</a>` : ''}
          </div>

          <div style="padding:0 1rem 0.625rem;display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center">
            <span class="delivery-chip ${chipClass}">${chipLabel}</span>
            <span class="payment-badge ${payClass}">${payLabel}</span>
            <span class="total-chip">${order.total || ''}</span>
          </div>

          ${isDelivery && order.alamat && order.alamat !== '-' ? `
          <div style="padding:0 1rem 0.625rem;font-size:0.72rem;color:#9ca3af;line-height:1.5">
            📍 ${order.alamat}
          </div>` : ''}

          <div class="card-divider"></div>

          <div class="card-items">${itemsHtml}</div>

          ${order.status !== 'Selesai' && order.status !== 'Batal' ? `
          <div class="card-footer">
            ${nextLabel ? `<button class="action-btn btn-next" onclick="updateStatus('${order.orderId}','${nextStatus}')">${nextLabel}</button>` : ''}
            ${order.status === 'Selesai' ? `<button class="action-btn btn-done" disabled>✓ Selesai</button>` : ''}
            ${hasGps ? `<a href="${mapsUrl}" target="_blank" class="action-btn btn-maps" style="text-align:center;text-decoration:none">🗺️</a>` : ''}
          </div>` : `
          <div class="card-footer">
            <span style="font-size:0.7rem;color:#6b7280;letter-spacing:1px">✓ ORDER SELESAI</span>
          </div>`}
        </div>`;
    }

    // Parse string items jadi HTML
    function parseItems(itemsStr) {
      if (!itemsStr) return '<div style="color:#6b7280;font-size:0.75rem">—</div>';

      return itemsStr.split(',').map(item => {
        item = item.trim();
        // Format: "Kebab Original(Ayam·Pedas)x2 [catatan]"
        const qtyMatch   = item.match(/x(\d+)/i);
        const nameMatch  = item.match(/^(.+?)\(/);
        const tagsMatch  = item.match(/\(([^)]+)\)/);
        const noteMatch  = item.match(/\[([^\]]+)\]/);

        const qty   = qtyMatch  ? qtyMatch[1]  : '1';
        const name  = nameMatch ? nameMatch[1].trim() : item;
        const tags  = tagsMatch ? tagsMatch[1].split(/[·\·\·]/).map(t => t.trim()) : [];
        const note  = noteMatch ? noteMatch[1] : null;

        const tagsHtml = tags.map((t, i) =>
          `<span class="item-tag ${i === 0 ? 'tag-daging' : 'tag-varian'}">${t}</span>`
        ).join('');

        return `
          <div class="item-row">
            <div class="item-name">
              ${name}
              <div class="item-tags">
                ${tagsHtml}
                ${note ? `<span class="item-tag tag-note">📝 ${note}</span>` : ''}
              </div>
            </div>
            <div class="item-qty">×${qty}</div>
          </div>`;
      }).join('');
    }

    // ============================================================
    // STATS
    // ============================================================
    function updateStats() {
      const counts = { Baru: 0, Diproses: 0, Siap: 0, Selesai: 0 };
      allOrders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
      document.getElementById('stat-baru').textContent     = counts.Baru;
      document.getElementById('stat-diproses').textContent = counts.Diproses;
      document.getElementById('stat-siap').textContent     = counts.Siap;
      document.getElementById('stat-selesai').textContent  = counts.Selesai;
    }

    // ============================================================
    // FILTER
    // ============================================================
    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    // ============================================================
    // NEW ORDER ALERT
    // ============================================================
    function showNewOrderAlert(count) {
      const banner = document.getElementById('new-order-banner');
      banner.textContent = `🔔 ${count} PESANAN BARU MASUK!`;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 4000);
    }

    // ============================================================
    // SOUND (Web Audio API — no file needed)
    // ============================================================
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [600, 800, 1000].forEach((freq, i) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.2);
          osc.start(ctx.currentTime + i * 0.15);
          osc.stop(ctx.currentTime + i * 0.15 + 0.25);
        });
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').textContent = soundEnabled ? '🔔 ON' : '🔕 OFF';
    }

    // ============================================================
    // COUNTDOWN & AUTO REFRESH
    // ============================================================
    function startCountdown() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
      countdownVal = REFRESH_INTERVAL;
      document.getElementById('refresh-fill').style.width = '100%';
      document.getElementById('countdown-text').textContent = `Refresh dalam ${REFRESH_INTERVAL}s`;

      refreshTimer = setInterval(() => {
        countdownVal--;
        const pct = Math.max(0, (countdownVal / REFRESH_INTERVAL) * 100);
        document.getElementById('refresh-fill').style.width = pct + '%';
        document.getElementById('countdown-text').textContent = `Refresh dalam ${Math.max(0, countdownVal)}s`;

        if (countdownVal <= 0) {
          clearInterval(refreshTimer); // stop dulu sebelum fetch
          refreshTimer = null;
          fetchOrders();              // fetchOrders() akan panggil startCountdown() lagi
        }
      }, 1000);
    }

    function resetCountdown() {
      startCountdown(); // delegasi ke startCountdown yang sudah benar
    }

    // ============================================================
    // INIT
    // ============================================================
    checkAutoLogin();
  </script>
</body>
</html>
