<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="icon" type="image/png" href="./logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KF Kitchen — Dapur Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0c0c0c;
      --surface:  #151515;
      --surface2: #1e1e1e;
      --border:   #272727;
      --border2:  #333;
      --muted:    #444;
      --sub:      #666;
      --text:     #e8e8e8;
      --dim:      #999;
      --fire:     #ff5500;
      --ember:    #ff7733;
      --gold:     #ffaa00;
      --new:      #ff3333;
      --process:  #ffaa00;
      --ready:    #00cc66;
      --diantar:  #3388ff;
      --diambil:  #aa55ff;
      --done:     #444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOGIN ───────────────────────────────── */
    #login-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      padding: 2rem;
    }

    .login-box {
      width: 100%; max-width: 360px;
      border: 1px solid var(--border2);
      border-top: 3px solid var(--fire);
      background: var(--surface);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .login-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--fire);
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 0.15rem;
    }

    .login-sub {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .login-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      padding: 1rem;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.5rem;
      letter-spacing: 10px;
      text-align: center;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .login-input:focus { border-color: var(--fire); }

    .login-btn {
      width: 100%;
      background: var(--fire);
      color: white;
      border: none;
      padding: 0.875rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .login-btn:hover { background: var(--ember); }
    .login-error { color: var(--new); font-size: 0.7rem; margin-top: 0.75rem; display: none; }

    /* ── APP ────────────────────────────────── */
    #app { display: none; }

    /* ── HEADER ─────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 52px;
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
    }

    .header-left { display: flex; align-items: center; gap: 1rem; }

    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--text);
    }
    .header-logo em { color: var(--fire); font-style: normal; }

    .header-badge {
      background: var(--fire);
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      letter-spacing: 1px;
    }

    .header-right { display: flex; align-items: center; gap: 0.75rem; }

    .live-pill {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.6rem;
      color: var(--ready);
      letter-spacing: 2px;
      border: 1px solid rgba(0,204,102,0.25);
      padding: 0.25rem 0.6rem;
    }
    .live-dot {
      width: 5px; height: 5px;
      background: var(--ready);
      border-radius: 50%;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    #sync-status {
      font-size: 0.58rem;
      color: var(--sub);
      letter-spacing: 0.5px;
      min-width: 70px;
      text-align: right;
    }

    .hdr-btn {
      background: none;
      border: 1px solid var(--border2);
      padding: 0.3rem 0.7rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      color: var(--dim);
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .hdr-btn:hover { border-color: var(--fire); color: var(--fire); }

    /* ── STATS ROW ──────────────────────────── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      padding: 1rem 0;
      text-align: center;
      border-right: 1px solid var(--border);
      position: relative;
    }
    .stat-item:last-child { border-right: none; }
    .stat-item::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .stat-new::after   { background: var(--new);     }
    .stat-proc::after  { background: var(--process);  }
    .stat-ready::after { background: var(--ready);    }
    .stat-done::after  { background: var(--done);     }
    .stat-item:hover::after { opacity: 1; }

    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.75rem;
      letter-spacing: -1px;
      line-height: 1;
      transition: color 0.3s;
    }
    .stat-label {
      font-size: 0.55rem;
      color: var(--sub);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }
    .stat-new  .stat-num { color: var(--new);     }
    .stat-proc .stat-num { color: var(--process); }
    .stat-ready .stat-num { color: var(--ready);   }
    .stat-done .stat-num  { color: var(--done);    }

    /* ── FILTER TABS ────────────────────────── */
    .filter-tabs {
      display: flex; gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: none;
      border: none;
      border-right: 1px solid var(--border);
      padding: 0.75rem 1.125rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      color: var(--sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      letter-spacing: 0.5px;
      position: relative;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--fire);
      transform: scaleX(0);
      transition: transform 0.15s;
    }
    .tab-btn:hover { color: var(--text); background: var(--surface2); }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after { transform: scaleX(1); }

    /* ── ORDER GRID ─────────────────────────── */
    .order-grid {
      padding: 1.25rem 1.5rem 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1px;
      background: var(--border);
    }

    /* ── ORDER CARD ─────────────────────────── */
    .order-card {
      background: var(--surface);
      position: relative;
      padding-left: 4px; /* space for accent bar */
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
    }
    .order-card:hover { background: var(--surface2); }

    /* Left accent bar */
    .order-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }
    .order-card.s-Baru::before     { background: var(--new); }
    .order-card.s-Diproses::before { background: var(--process); }
    .order-card.s-Siap::before     { background: var(--ready); }
    .order-card.s-Diantar::before  { background: var(--diantar); }
    .order-card.s-Diambil::before  { background: var(--diambil); }
    .order-card.s-Selesai::before  { background: var(--done); }
    .order-card.s-Batal::before    { background: #222; }

    .card-inner { padding: 1rem 1rem 0 0.875rem; flex: 1; }

    /* Header row */
    .card-row1 {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .card-id {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 2px;
      color: var(--fire);
    }
    .card-time {
      font-size: 0.6rem;
      color: var(--sub);
      margin-top: 0.1rem;
    }

    /* Status badge - minimal */
    .sbadge {
      font-size: 0.55rem;
      font-weight: 500;
      padding: 0.2rem 0.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .sb-Baru     { color: var(--new);     border: 1px solid rgba(255,51,51,0.3); }
    .sb-Diproses { color: var(--process); border: 1px solid rgba(255,170,0,0.3); }
    .sb-Siap     { color: var(--ready);   border: 1px solid rgba(0,204,102,0.3); }
    .sb-Diantar  { color: var(--diantar); border: 1px solid rgba(51,136,255,0.3); }
    .sb-Diambil  { color: var(--diambil); border: 1px solid rgba(170,85,255,0.3); }
    .sb-Selesai  { color: var(--done);    border: 1px solid #333; }
    .sb-Batal    { color: #444;           border: 1px solid #333; }

    /* Customer */
    .card-customer {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .wa-link {
      font-size: 0.6rem;
      color: var(--ready);
      text-decoration: none;
      font-weight: 400;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .wa-link:hover { opacity: 1; }

    /* Chips */
    .card-chips {
      display: flex; gap: 0.35rem; flex-wrap: wrap;
      margin-bottom: 0.625rem;
    }
    .chip {
      font-size: 0.55rem;
      padding: 0.15rem 0.45rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .ch-delivery { color: var(--diantar); border: 1px solid rgba(51,136,255,0.2); }
    .ch-pickup   { color: var(--diambil); border: 1px solid rgba(170,85,255,0.2); }
    .ch-qris     { color: #a78bfa;        border: 1px solid rgba(167,139,250,0.2); }
    .ch-cash     { color: var(--ready);   border: 1px solid rgba(0,204,102,0.2); }
    .ch-total    { color: var(--gold);    border: 1px solid rgba(255,170,0,0.25); font-weight: 700; }

    .card-address {
      font-size: 0.65rem;
      color: var(--sub);
      line-height: 1.6;
      margin-bottom: 0.625rem;
      padding-left: 0.5rem;
      border-left: 2px solid var(--border2);
    }

    .card-divider { height: 1px; background: var(--border); margin: 0 0 0.625rem; }

    /* Items */
    .card-items {
      display: flex; flex-direction: column; gap: 0.5rem;
      margin-bottom: 0.875rem;
    }
    .item-row {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
    }
    .item-name { font-size: 0.75rem; line-height: 1.45; flex: 1; color: var(--text); }
    .item-qty  { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--fire); flex-shrink: 0; letter-spacing: 1px; }
    .item-tags { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .item-tag  { font-size: 0.55rem; padding: 0.1rem 0.35rem; font-weight: 500; }
    .t-daging  { color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
    .t-varian  { color: var(--ready); border: 1px solid rgba(0,204,102,0.2); }
    .t-note    { color: #fde047; border: 1px solid rgba(253,224,71,0.2); }

    /* Card footer */
    .card-footer {
      display: flex; gap: 0;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    .action-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      border: none;
      border-right: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
      text-align: center;
      background: none;
      color: var(--dim);
    }
    .action-btn:last-child { border-right: none; }

    .btn-primary {
      background: rgba(255,85,0,0.08);
      color: var(--fire);
    }
    .btn-primary:hover { background: var(--fire); color: white; }

    .btn-maps {
      background: rgba(51,136,255,0.06);
      color: var(--diantar);
      text-decoration: none;
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
      padding: 0.75rem 0.875rem;
    }
    .btn-maps:hover { background: rgba(51,136,255,0.15); }

    .done-label {
      padding: 0.75rem 1rem;
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── EMPTY STATE ────────────────────────── */
    .empty-state {
      grid-column: 1/-1;
      background: var(--surface);
      text-align: center;
      padding: 5rem 2rem;
    }
    .empty-icon { font-size: 2.5rem; opacity: 0.3; margin-bottom: 1rem; }
    .empty-text { font-family: 'Bebas Neue', sans-serif; font-size: 1.25rem; letter-spacing: 3px; color: var(--sub); }
    .empty-sub  { font-size: 0.6rem; color: var(--muted); margin-top: 0.5rem; letter-spacing: 2px; }

    /* ── NEW ORDER BANNER ───────────────────── */
    #new-order-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: var(--new);
      color: white;
      text-align: center;
      padding: 0.875rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.125rem;
      letter-spacing: 5px;
      z-index: 100;
      transform: translateY(-100%);
      transition: transform 0.25s ease;
    }
    #new-order-banner.show { transform: translateY(0); }

    /* ── MANUAL REFRESH BUTTON ──────────────── */
    #refresh-fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      width: 2.75rem; height: 2.75rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--sub);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      z-index: 10;
    }
    #refresh-fab:hover { border-color: var(--fire); color: var(--fire); }
    #refresh-fab.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 480px) {
      .order-grid { grid-template-columns: 1fr; padding: 0 0 5rem; }
      .stat-num   { font-size: 2.25rem; }
      .stats-bar  { gap: 0; }
      .header     { padding: 0 1rem; }
    }
    @media (min-width: 1200px) {
      .order-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">KF Kitchen</div>
    <div class="login-sub">Dapur · Dashboard</div>
    <input type="password" id="pin-input" class="login-input"
      placeholder="••••" maxlength="12"
      onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">MASUK</button>
    <p class="login-error" id="login-error">PIN salah. Coba lagi.</p>
  </div>
</div>

<!-- ── APP ──────────────────────────────────────── -->
<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">🔥 <em>KF</em> Kitchen</div>
      <span class="header-badge" id="active-count">0 aktif</span>
    </div>
    <div class="header-right">
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
      <span id="sync-status">—</span>
      <button class="hdr-btn" onclick="toggleSound()" id="sound-btn">🔔 ON</button>
      <button class="hdr-btn" onclick="doLogout()">KELUAR</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item stat-new">
      <div class="stat-num" id="stat-baru">0</div>
      <div class="stat-label">Baru</div>
    </div>
    <div class="stat-item stat-proc">
      <div class="stat-num" id="stat-diproses">0</div>
      <div class="stat-label">Diproses</div>
    </div>
    <div class="stat-item stat-ready">
      <div class="stat-num" id="stat-siap">0</div>
      <div class="stat-label">Siap</div>
    </div>
    <div class="stat-item stat-done">
      <div class="stat-num" id="stat-selesai">0</div>
      <div class="stat-label">Selesai</div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('Semua',this)">Semua</button>
    <button class="tab-btn" onclick="setFilter('Baru',this)">Baru</button>
    <button class="tab-btn" onclick="setFilter('Diproses',this)">Diproses</button>
    <button class="tab-btn" onclick="setFilter('Siap',this)">Siap</button>
    <button class="tab-btn" onclick="setFilter('Diantar',this)">Diantar</button>
    <button class="tab-btn" onclick="setFilter('Diambil',this)">Diambil</button>
    <button class="tab-btn" onclick="setFilter('Selesai',this)">Selesai</button>
    <button class="tab-btn" onclick="setFilter('Delivery',this)">Delivery</button>
    <button class="tab-btn" onclick="setFilter('Pickup',this)">Pickup</button>
  </div>

  <!-- Order Grid -->
  <div class="order-grid" id="order-grid">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Memuat pesanan</div>
      <div class="empty-sub">Menghubungi server</div>
    </div>
  </div>

  <!-- New order banner -->
  <div id="new-order-banner">🔔 PESANAN BARU MASUK</div>

  <!-- Refresh FAB -->
  <button id="refresh-fab" onclick="manualRefresh()" title="Refresh">↺</button>

</div>

<script>
  const APPS_SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbx_p4L2kJFZEciZHpG5cyXDM1wnzB6i0nE5u9p42P08uytzTHBV9etoXp-pgz65NohEkg/exec';
  const DAPUR_PIN        = 'kf2026';
  const REFRESH_INTERVAL = 20; // detik

  let allOrders     = [];
  let activeFilter  = 'Semua';
  let soundEnabled  = true;
  let fetchTimer    = null;
  let knownOrderIds = new Set();
  let isFirstLoad   = true;
  let lastSyncTime  = null;

  // ── LOGIN ──────────────────────────────────
  function doLogin() {
    const pin = document.getElementById('pin-input').value.trim();
    if (pin === DAPUR_PIN) {
      localStorage.setItem('kf_dapur_auth', btoa(pin + '_' + Date.now()));
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      startApp();
    } else {
      const err = document.getElementById('login-error');
      err.style.display = 'block';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
      setTimeout(() => err.style.display = 'none', 3000);
    }
  }

  function doLogout() {
    localStorage.removeItem('kf_dapur_auth');
    location.reload();
  }

  function checkAutoLogin() {
    const stored = localStorage.getItem('kf_dapur_auth');
    if (stored) {
      try {
        const decoded = atob(stored);
        const parts   = decoded.split('_');
        const ts      = parseInt(parts[parts.length - 1]);
        if (Date.now() - ts < 12 * 60 * 60 * 1000) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          startApp();
          return;
        }
      } catch(e) {}
      localStorage.removeItem('kf_dapur_auth');
    }
  }

  // ── APP START ──────────────────────────────
  function startApp() {
    fetchOrders();
    scheduleFetch();
  }

  function scheduleFetch() {
    if (fetchTimer) clearTimeout(fetchTimer);
    fetchTimer = setTimeout(() => { fetchOrders(); scheduleFetch(); }, REFRESH_INTERVAL * 1000);
  }

  // ── SYNC STATUS LABEL ──────────────────────
  function setSyncing() {
    document.getElementById('sync-status').textContent = '⟳ sync';
    const fab = document.getElementById('refresh-fab');
    if (fab) fab.classList.add('spinning');
  }

  function setSynced() {
    lastSyncTime = Date.now();
    document.getElementById('sync-status').textContent = '✓ baru saja';
    const fab = document.getElementById('refresh-fab');
    if (fab) fab.classList.remove('spinning');
    setTimeout(() => {
      if (lastSyncTime) {
        const s = Math.round((Date.now() - lastSyncTime) / 1000);
        document.getElementById('sync-status').textContent = s < 60 ? s + 'd lalu' : Math.round(s/60) + 'm lalu';
      }
    }, 8000);
  }

  function setSyncError() {
    document.getElementById('sync-status').textContent = '⚠ gagal';
    const fab = document.getElementById('refresh-fab');
    if (fab) fab.classList.remove('spinning');
  }

  // ── FETCH ORDERS ───────────────────────────
  async function fetchOrders() {
    setSyncing();
    try {
      const res  = await fetch(APPS_SCRIPT_URL + '?action=getAllOrders&t=' + Date.now());
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch(e) { throw new Error('Server tidak merespons JSON.'); }

      if (data.orders) {
        const prevIds   = new Set(knownOrderIds);
        const newOrders = [];
        data.orders.forEach(o => {
          if (!prevIds.has(o.orderId) && !isFirstLoad) newOrders.push(o.orderId);
          knownOrderIds.add(o.orderId);
        });
        if (newOrders.length > 0) {
          showNewOrderAlert(newOrders.length);
          if (soundEnabled) playBeep();
        }
        allOrders   = data.orders;
        isFirstLoad = false;
        renderOrders();
        updateStats();
        setSynced();
      } else if (data.error) {
        throw new Error('Apps Script: ' + data.error);
      }
    } catch (err) {
      console.error('fetchOrders:', err.message);
      setSyncError();
      if (allOrders.length === 0) {
        document.getElementById('order-grid').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div class="empty-text">Gagal terhubung</div>
            <div class="empty-sub" style="max-width:260px;margin:.5rem auto 0;line-height:2">${err.message}</div>
          </div>`;
      }
    }
  }

  function manualRefresh() {
    if (fetchTimer) clearTimeout(fetchTimer);
    fetchOrders();
    scheduleFetch();
  }

  // ── UPDATE STATUS ──────────────────────────
  async function updateStatus(orderId, newStatus) {
    const order = allOrders.find(o => o.orderId === orderId);
    if (order) order.status = newStatus;
    renderOrders();
    updateStats();
    try {
      const payload = new URLSearchParams();
      payload.append('action',  'updateStatus');
      payload.append('orderId', orderId);
      payload.append('status',  newStatus);
      await fetch(APPS_SCRIPT_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body:    payload
      });
    } catch (err) { console.warn('Status update failed:', err); }
  }

  // ── RENDER ─────────────────────────────────
  function renderOrders() {
    const grid = document.getElementById('order-grid');
    let filtered = [...allOrders];

    if (activeFilter === 'Delivery') {
      filtered = filtered.filter(o => String(o.pengiriman||'').toLowerCase().includes('delivery'));
    } else if (activeFilter === 'Pickup') {
      filtered = filtered.filter(o => {
        const p = String(o.pengiriman||'').toLowerCase();
        return p.includes('ambil') || p.includes('pickup');
      });
    } else if (activeFilter !== 'Semua') {
      filtered = filtered.filter(o => o.status === activeFilter);
    }

    const ord = { 'Baru':0,'Diproses':1,'Siap':2,'Diantar':3,'Diambil':3,'Selesai':4,'Batal':5 };
    filtered.sort((a, b) => (ord[a.status]??9) - (ord[b.status]??9));

    const activeCount = allOrders.filter(o => !['Selesai','Batal'].includes(o.status)).length;
    document.getElementById('active-count').textContent = activeCount + ' aktif';

    if (!filtered.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🫙</div>
          <div class="empty-text">Tidak ada pesanan</div>
          <div class="empty-sub">${activeFilter === 'Semua' ? 'Belum ada order masuk' : 'Filter: ' + activeFilter}</div>
        </div>`;
      return;
    }

    try {
      grid.innerHTML = filtered.map(order => buildCard(order)).join('');
    } catch(e) {
      console.error('buildCard error:', e);
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🐛</div><div class="empty-text">Error render</div><div class="empty-sub">' + e.message + '</div></div>';
    }
  }

  function buildCard(order) {
    const isDelivery = String(order.pengiriman||'').toLowerCase().includes('delivery');
    const payIsQris  = String(order.pembayaran||'').toLowerCase().includes('qris');
    const itemsHtml  = parseItems(order.items || '');

    // Smart status flow: Siap → Diantar (delivery) atau Diambil (pickup)
    let nextLabel = '', nextStatus = '';
    if      (order.status === 'Baru')     { nextLabel = '▶ PROSES';    nextStatus = 'Diproses'; }
    else if (order.status === 'Diproses') { nextLabel = '✓ SIAP';      nextStatus = 'Siap'; }
    else if (order.status === 'Siap') {
      if (isDelivery) { nextLabel = '🛵 KIRIM';  nextStatus = 'Diantar'; }
      else            { nextLabel = '🛍 DIAMBIL'; nextStatus = 'Diambil'; }
    }
    else if (order.status === 'Diantar' || order.status === 'Diambil') {
                        nextLabel = '■ SELESAI'; nextStatus = 'Selesai'; }

    const hasGps  = isDelivery && order.userLat && order.userLng;
    const mapsUrl = hasGps ? `https://maps.google.com?q=${order.userLat},${order.userLng}` : null;
    const isDone  = order.status === 'Selesai' || order.status === 'Batal';

    return `<div class="order-card s-${order.status}" id="card-${order.orderId}">
      <div class="card-inner">
        <div class="card-row1">
          <div>
            <div class="card-id">${order.orderId}</div>
            <div class="card-time">${order.timestamp || ''}</div>
          </div>
          <span class="sbadge sb-${order.status}">${order.status||'Baru'}</span>
        </div>

        <div class="card-customer">
          ${order.nama || '-'}
          ${order.noWA ? `<a href="https://wa.me/${String(order.noWA).replace(/\D/g,'')}" target="_blank" class="wa-link">WA ↗</a>` : ''}
        </div>

        <div class="card-chips">
          <span class="chip ${isDelivery ? 'ch-delivery' : 'ch-pickup'}">${isDelivery ? '🛵 Delivery' : '🏪 Pickup'}</span>
          <span class="chip ${payIsQris ? 'ch-qris' : 'ch-cash'}">${order.pembayaran||'Cash'}</span>
          <span class="chip ch-total">${order.total||''}</span>
        </div>

        ${isDelivery && order.alamat && order.alamat !== '-' ? `<div class="card-address">📍 ${order.alamat}</div>` : ''}

        <div class="card-divider"></div>
        <div class="card-items">${itemsHtml}</div>
      </div>

      <div class="card-footer">
        ${isDone
          ? `<span class="done-label">✓ Order Selesai</span>`
          : `${nextLabel ? `<button class="action-btn btn-primary" onclick="updateStatus('${order.orderId}','${nextStatus}')">${nextLabel}</button>` : ''}
             ${hasGps ? `<a href="${mapsUrl}" target="_blank" class="action-btn btn-maps">🗺</a>` : ''}`
        }
      </div>
    </div>`;
  }

  function parseItems(itemsStr) {
    if (!itemsStr) return '<div style="color:#444;font-size:.7rem">—</div>';
    return itemsStr.split(',').map(item => {
      item = item.trim();
      const qtyMatch  = item.match(/x(\d+)/i);
      const nameMatch = item.match(/^(.+?)\(/);
      const tagsMatch = item.match(/\(([^)]+)\)/);
      const noteMatch = item.match(/\[([^\]]+)\]/);
      const qty  = qtyMatch  ? qtyMatch[1]  : '1';
      const name = nameMatch ? nameMatch[1].trim() : item.replace(/x\d+/i,'').trim();
      const tags = tagsMatch ? tagsMatch[1].split(/[·]/).map(t=>t.trim()).filter(Boolean) : [];
      const note = noteMatch ? noteMatch[1] : null;
      const tagsHtml = tags.map((t,i) =>
        `<span class="item-tag ${i===0 ? 't-daging' : 't-varian'}">${t}</span>`
      ).join('');
      return `<div class="item-row">
        <div class="item-name">
          ${name}
          ${(tagsHtml||note) ? `<div class="item-tags">${tagsHtml}${note ? `<span class="item-tag t-note">📝 ${note}</span>` : ''}</div>` : ''}
        </div>
        <div class="item-qty">×${qty}</div>
      </div>`;
    }).join('');
  }

  // ── STATS ──────────────────────────────────
  function updateStats() {
    const c = { Baru:0, Diproses:0, Siap:0, Selesai:0 };
    allOrders.forEach(o => { if (c[o.status]!==undefined) c[o.status]++; });
    document.getElementById('stat-baru').textContent     = c.Baru;
    document.getElementById('stat-diproses').textContent = c.Diproses;
    document.getElementById('stat-siap').textContent     = c.Siap;
    document.getElementById('stat-selesai').textContent  = c.Selesai;
  }

  // ── FILTER ─────────────────────────────────
  function setFilter(filter, btn) {
    activeFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderOrders();
  }

  // ── ALERTS ─────────────────────────────────
  function showNewOrderAlert(count) {
    const b = document.getElementById('new-order-banner');
    b.textContent = '🔔 ' + count + ' PESANAN BARU MASUK';
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 4000);
  }

  // ── SOUND ──────────────────────────────────
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [500, 700, 900].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = 'triangle';
        gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.18);
        osc.start(ctx.currentTime + i * 0.12);
        osc.stop(ctx.currentTime + i * 0.12 + 0.2);
      });
    } catch(e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-btn').textContent = soundEnabled ? '🔔 ON' : '🔕 OFF';
  }

  // ── INIT ───────────────────────────────────
  checkAutoLogin();
</script>
</body>
</html>
