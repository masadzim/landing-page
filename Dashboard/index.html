<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KF Kitchen Display System | KDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #111827;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 20px;
      min-height: 100vh;
      color: #F3F4F6;
    }

    /* MAIN KANBAN CONTAINER */
    .kds-container {
      max-width: 1800px;
      margin: 0 auto;
    }

    /* header + stats row */
    .kds-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 28px;
      gap: 16px;
      border-bottom: 2px solid #374151;
      padding-bottom: 16px;
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FF6B00, #FF8C42);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand p {
      font-size: 0.8rem;
      font-weight: 500;
      color: #9CA3AF;
      letter-spacing: 0.5px;
    }

    .stats-group {
      display: flex;
      gap: 28px;
      background: #1F2937;
      padding: 8px 24px;
      border-radius: 60px;
      border: 1px solid #374151;
    }

    .stat-badge {
      font-weight: 700;
      font-size: 1rem;
    }
    .stat-badge span {
      font-size: 1.5rem;
      font-weight: 800;
      margin-right: 6px;
      color: #FF6B00;
    }

    /* KANBAN COLUMNS (flex horizontal, responsive wrap) */
    .kanban-board {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 20px;
      scrollbar-width: thin;
    }

    .kanban-col {
      flex: 1;
      min-width: 280px;
      background: #111827;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .col-header {
      background: #1F2937;
      padding: 16px 12px;
      border-radius: 20px;
      text-align: center;
      border-left: 5px solid;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .col-header .col-count {
      background: #111827;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* Column color accents */
    .col-new { border-left-color: #6B7280; }      /* Grey accent */
    .col-diproses { border-left-color: #FF6B00; }  /* Orange/processing */
    .col-siap { border-left-color: #10B981; }      /* Green ready */
    .col-diantar { border-left-color: #60A5FA; }
    .col-diambil { border-left-color: #A78BFA; }
    .col-selesai { border-left-color: #4B5563; }   /* Dark/completed */

    /* card container (scrollable inside column) */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: calc(100vh - 210px);
      overflow-y: auto;
      padding-right: 4px;
    }

    /* ORDER CARD — extremely readable, large bold text */
    .order-card {
      background: #1F2937;
      border-radius: 20px;
      padding: 20px 18px;
      transition: all 0.1s ease;
      border: 1px solid #374151;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .order-card:hover {
      background: #2D3A4E;
      border-color: #FF6B0040;
    }

    /* row 1 : order number + timer */
    .card-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 14px;
      border-bottom: 1px dashed #374151;
      padding-bottom: 12px;
    }

    .order-num {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: #FF6B0020;
      padding: 2px 10px;
      border-radius: 40px;
      color: #FF9F5C;
      font-family: monospace;
    }

    .elapsed-time {
      font-size: 1.2rem;
      font-weight: 700;
      background: #111827;
      padding: 4px 12px;
      border-radius: 32px;
      color: #FCD34D;
      font-feature-settings: 'tnum';
      letter-spacing: 0.5px;
    }

    /* order type & additional chips */
    .order-meta {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .type-badge {
      background: #0F172A;
      padding: 5px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #CBD5E1;
    }

    .type-badge.delivery { border-left: 3px solid #60A5FA; background: #1E2A3A; }
    .type-badge.pickup   { border-left: 3px solid #A78BFA; background: #1E2A3A; }

    /* items container - large & clean */
    .items-list {
      margin: 12px 0 16px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .item-line {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-left: 3px solid #FF6B00;
      padding-left: 12px;
    }

    .item-name {
      font-weight: 700;
      font-size: 1.15rem;
      word-break: break-word;
      color: #F9FAFB;
    }

    .item-qty {
      font-weight: 800;
      font-size: 1.2rem;
      background: #111827;
      padding: 2px 12px;
      border-radius: 32px;
      color: #FF8C42;
    }

    /* modifiers (extra, spice, notes) — clearly visible */
    .modifiers {
      margin-top: 8px;
      margin-left: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .mod-tag {
      background: #2D3748;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #E5E7EB;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .mod-tag::before {
      content: "·";
      font-weight: 900;
      color: #FF6B00;
      font-size: 1rem;
    }

    /* status button (large touch friendly) */
    .action-status-btn {
      width: 100%;
      margin-top: 20px;
      background: #FF6B00;
      border: none;
      padding: 14px 10px;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: white;
      cursor: pointer;
      transition: all 0.1s linear;
      text-align: center;
      font-family: 'Inter', monospace;
    }

    .action-status-btn.completed-btn {
      background: #374151;
      cursor: default;
      opacity: 0.8;
    }

    .action-status-btn:hover:not(.completed-btn) {
      background: #E05E00;
      transform: scale(0.98);
    }

    /* completed cards have slightly darker style */
    .order-card.completed-card {
      background: #1A2536;
      border-color: #2D3A4E;
      opacity: 0.85;
    }

    /* empty column placeholder */
    .empty-col-message {
      text-align: center;
      padding: 40px 16px;
      background: #1F2937;
      border-radius: 24px;
      color: #6B7280;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px dashed #374151;
    }

    /* scroll & responsiveness */
    .kanban-board::-webkit-scrollbar {
      height: 6px;
    }
    .kanban-board::-webkit-scrollbar-track {
      background: #1F2937;
      border-radius: 8px;
    }
    .kanban-board::-webkit-scrollbar-thumb {
      background: #FF6B00;
      border-radius: 8px;
    }

    /* live indicator */
    .live-pulse {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1F2937;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      background-color: #10B981;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .order-num { font-size: 1.1rem; }
      .item-name { font-size: 0.95rem; }
      .item-qty { font-size: 1rem; }
      .action-status-btn { font-size: 1rem; padding: 10px; }
    }
  </style>
</head>
<body>

<div class="kds-container">
  <div class="kds-header">
    <div class="brand">
      <h1>🍳 KF KITCHEN · KDS</h1>
      <p>VISIBLE FROM 3M • KANBAN FLOW</p>
    </div>
    <div class="stats-group" id="global-stats">
      <div class="stat-badge"><span id="total-active">0</span> aktif</div>
      <div class="live-pulse"><span class="dot"></span> LIVE · auto refresh</div>
    </div>
  </div>

  <div class="kanban-board" id="kanban-board">
    <!-- 6 columns: Baru, Diproses, Siap, Diantar, Diambil, Selesai -->
  </div>
</div>

<script>
  // --------------------------------------------------------------
  // CONFIGURATION
  // --------------------------------------------------------------
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_p4L2kJFZEciZHpG5cyXDM1wnzB6i0nE5u9p42P08uytzTHBV9etoXp-pgz65NohEkg/exec';
  const REFRESH_INTERVAL = 15; // seconds (fast kitchen sync)
  let allOrders = [];
  let knownOrderIds = new Set();
  let isFirstLoad = true;

  // status flow mapping (next status based on current)
  function getNextStatus(currentStatus, orderType = 'delivery') {
    switch(currentStatus) {
      case 'Baru': return 'Diproses';
      case 'Diproses': return 'Siap';
      case 'Siap': 
        // logic: if delivery -> Diantar, if pickup -> Diambil
        if (orderType === 'delivery') return 'Diantar';
        return 'Diambil';
      case 'Diantar': return 'Selesai';
      case 'Diambil': return 'Selesai';
      default: return null;
    }
  }

  // helper: determine order type (delivery/pickup) from pengiriman field
  function getOrderType(order) {
    const deliveryField = String(order.pengiriman || '').toLowerCase();
    if (deliveryField.includes('delivery')) return 'delivery';
    if (deliveryField.includes('pickup') || deliveryField.includes('ambil')) return 'pickup';
    // fallback
    return (order.alamat && order.alamat !== '-' && order.alamat !== '') ? 'delivery' : 'pickup';
  }

  // calculate elapsed time (minutes since order creation)
  function getElapsedMinutes(timestampStr) {
    if (!timestampStr) return '0 min';
    let orderDate;
    // try parsing typical formats: "2/3/2025 19:45:13" or ISO
    if (timestampStr.includes('/') || timestampStr.includes('-')) {
      orderDate = new Date(timestampStr);
    } else {
      orderDate = new Date(timestampStr);
    }
    if (isNaN(orderDate.getTime())) return '—';
    const diffMs = Date.now() - orderDate.getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 0) return '0 min';
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    return `${hours}h ${mins % 60}m`;
  }

  // parse items + modifiers (notes, extra, level spicy)
  function parseItemsWithModifiers(itemsStr) {
    if (!itemsStr) return [];
    const result = [];
    const rawItems = itemsStr.split(',').map(i => i.trim()).filter(i => i);
    for (let raw of rawItems) {
      // extract quantity: format like "2x Nama item (Daging Sapi) [Extra Keju]"
      let qty = 1;
      let namePart = raw;
      const qtyMatch = raw.match(/^(\d+)x\s*/i);
      if (qtyMatch) {
        qty = parseInt(qtyMatch[1], 10);
        namePart = raw.replace(/^\d+x\s*/i, '');
      }
      // extract main name: everything before '(' or '[' or end
      let mainName = namePart;
      let modifiers = [];
      // parentheses content (varian/daging)
      const parenMatch = namePart.match(/\(([^)]+)\)/);
      if (parenMatch) {
        modifiers.push(parenMatch[1]);
        mainName = mainName.replace(`(${parenMatch[1]})`, '').trim();
      }
      // bracket content (extra notes, level)
      const bracketMatch = namePart.match(/\[([^\]]+)\]/);
      if (bracketMatch) {
        const note = bracketMatch[1];
        modifiers.push(note);
        mainName = mainName.replace(`[${bracketMatch[1]}]`, '').trim();
      }
      // additional splitted by '·' sometimes inside brackets? but we already capture
      // also custom: if leftover "Extra Keju" pattern inside description
      const extraMatch = namePart.match(/(Extra\s+\w+)/i);
      if (extraMatch && !modifiers.includes(extraMatch[1])) modifiers.push(extraMatch[1]);
      if (namePart.toLowerCase().includes('pedas') && !modifiers.some(m => m.toLowerCase().includes('pedas'))) {
        modifiers.push('🌶️ Pedas');
      }
      result.push({
        qty,
        name: mainName || namePart.substring(0, 30),
        modifiers: modifiers.slice(0, 3)
      });
    }
    return result;
  }

  // render entire Kanban board based on allOrders
  function renderKanban() {
    const board = document.getElementById('kanban-board');
    const statuses = ['Baru', 'Diproses', 'Siap', 'Diantar', 'Diambil', 'Selesai'];
    const statusLabels = {
      Baru: '🆕 BARU', Diproses: '🔥 DIPROSES', Siap: '✅ SIAP',
      Diantar: '🛵 DIANTAR', Diambil: '🛍️ DIAMBIL', Selesai: '✓ SELESAI'
    };
    const colAccents = {
      Baru: 'col-new', Diproses: 'col-diproses', Siap: 'col-siap',
      Diantar: 'col-diantar', Diambil: 'col-diambil', Selesai: 'col-selesai'
    };
    
    let activeCount = allOrders.filter(o => o.status !== 'Selesai' && o.status !== 'Batal').length;
    document.getElementById('total-active').innerText = activeCount;

    let columnsHtml = '';
    for (let status of statuses) {
      const ordersInCol = allOrders.filter(order => order.status === status);
      // sort by timestamp old->new (FIFO: first in first out for kitchen)
      const sorted = [...ordersInCol].sort((a,b) => {
        const tA = a.timestamp || a.orderId || '';
        const tB = b.timestamp || b.orderId || '';
        return tA.localeCompare(tB);
      });
      
      let cardsHtml = '';
      for (let order of sorted) {
        const orderType = getOrderType(order);
        const elapsed = getElapsedMinutes(order.timestamp);
        const itemsParsed = parseItemsWithModifiers(order.items || '');
        const isCompleted = (order.status === 'Selesai' || order.status === 'Batal');
        const nextStatus = getNextStatus(order.status, orderType);
        const buttonLabel = (order.status === 'Siap') 
          ? (orderType === 'delivery' ? '🛵 KIRIM' : '📦 DIAMBIL')
          : (nextStatus ? `▶ ${nextStatus.toUpperCase()}` : 'SELESAI');
        
        // build items + modifiers HTML
        let itemsHtml = '';
        for (let it of itemsParsed) {
          itemsHtml += `
            <div class="item-line">
              <span class="item-name">${escapeHtml(it.name)}</span>
              <span class="item-qty">×${it.qty}</span>
            </div>
          `;
          if (it.modifiers && it.modifiers.length) {
            let modHtml = '<div class="modifiers">';
            it.modifiers.forEach(mod => {
              modHtml += `<span class="mod-tag">${escapeHtml(mod)}</span>`;
            });
            modHtml += '</div>';
            itemsHtml += modHtml;
          }
        }
        if (itemsParsed.length === 0) {
          itemsHtml = `<div class="item-line"><span class="item-name">— item tidak tersedia —</span></div>`;
        }
        
        // extra notes from order level (global note)
        let globalNote = '';
        if (order.catatan && order.catatan !== '-' && order.catatan) {
          globalNote = `<div class="modifiers" style="margin-top:6px;"><span class="mod-tag">📝 ${escapeHtml(order.catatan)}</span></div>`;
        }
        
        cardsHtml += `
          <div class="order-card ${isCompleted ? 'completed-card' : ''}" data-order-id="${order.orderId}">
            <div class="card-row-top">
              <div class="order-num">${escapeHtml(order.orderId || '---')}</div>
              <div class="elapsed-time">⏱️ ${elapsed}</div>
            </div>
            <div class="order-meta">
              <span class="type-badge ${orderType === 'delivery' ? 'delivery' : 'pickup'}">
                ${orderType === 'delivery' ? '🚚 DELIVERY' : '🏪 PICKUP'}
              </span>
              <span class="type-badge" style="background:#1F2A3E;">💳 ${escapeHtml(order.pembayaran || 'Cash')}</span>
              ${order.total ? `<span class="type-badge" style="background:#FF6B0010;">💰 ${escapeHtml(order.total)}</span>` : ''}
            </div>
            <div class="items-list">
              ${itemsHtml}
            </div>
            ${globalNote}
            ${!isCompleted && nextStatus ? `
              <button class="action-status-btn" onclick="updateOrderStatus('${order.orderId}', '${nextStatus}')">
                ${buttonLabel}
              </button>
            ` : (isCompleted ? `<button class="action-status-btn completed-btn" disabled>✓ SELESAI</button>` : '')}
          </div>
        `;
      }
      
      if (cardsHtml === '') {
        cardsHtml = `<div class="empty-col-message">✨ Tidak ada pesanan</div>`;
      }
      
      columnsHtml += `
        <div class="kanban-col">
          <div class="col-header ${colAccents[status]}">
            <span>${statusLabels[status]}</span>
            <span class="col-count">${ordersInCol.length}</span>
          </div>
          <div class="cards-container">
            ${cardsHtml}
          </div>
        </div>
      `;
    }
    board.innerHTML = columnsHtml;
  }
  
  function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  // update order status (API call + local optimistic update)
  async function updateOrderStatus(orderId, newStatus) {
    // find order
    const orderIndex = allOrders.findIndex(o => o.orderId === orderId);
    if (orderIndex === -1) return;
    const oldStatus = allOrders[orderIndex].status;
    // Optimistic update
    allOrders[orderIndex].status = newStatus;
    renderKanban();
    updateStatsFromOrders();
    // notify backend
    try {
      const payload = new URLSearchParams();
      payload.append('action', 'updateStatus');
      payload.append('orderId', orderId);
      payload.append('status', newStatus);
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload
      });
      // optional: play subtle "chime" if new status is Siap? no heavy
      if (newStatus === 'Siap') {
        playShortBeep();
      }
    } catch (err) {
      console.warn('Status sync error, revert:', err);
      allOrders[orderIndex].status = oldStatus;
      renderKanban();
      updateStatsFromOrders();
    }
  }

  function playShortBeep() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.2;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
      osc.stop(ctx.currentTime + 0.3);
    } catch(e) { /* silent */ }
  }

  function updateStatsFromOrders() {
    const active = allOrders.filter(o => o.status !== 'Selesai' && o.status !== 'Batal').length;
    document.getElementById('total-active').innerText = active;
  }

  // fetch from Google Apps Script
  async function fetchOrders() {
    const syncSpan = document.createElement('div'); // not needed, but just visual no extra UI
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getAllOrders&nocache=${Date.now()}`);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Invalid JSON'); }
      
      if (data && data.orders) {
        const prevOrderIds = new Set(knownOrderIds);
        const newOrderEntries = [];
        // update known orders & new notifications
        data.orders.forEach(order => {
          if (!prevOrderIds.has(order.orderId) && !isFirstLoad) {
            newOrderEntries.push(order.orderId);
            // Optional: play new order sound (louder)
            playNewOrderSound();
          }
          knownOrderIds.add(order.orderId);
        });
        allOrders = data.orders.map(order => ({
          ...order,
          status: order.status || 'Baru',
          timestamp: order.timestamp || order.createdAt || new Date().toLocaleString(),
          items: order.items || '',
          nama: order.nama || 'Pelanggan',
          noWA: order.noWA || '',
          alamat: order.alamat || '',
          pengiriman: order.pengiriman || (order.alamat ? 'Delivery' : 'Pickup'),
          pembayaran: order.pembayaran || 'Cash',
          total: order.total || '',
          catatan: order.catatan || order.note || ''
        }));
        isFirstLoad = false;
        renderKanban();
        updateStatsFromOrders();
      } else if (data.error) {
        console.error('API error:', data.error);
      }
    } catch (err) {
      console.error('fetch error:', err);
      if (allOrders.length === 0) {
        const board = document.getElementById('kanban-board');
        if (board) board.innerHTML = `<div class="empty-col-message" style="grid-column:1/-1; text-align:center;">⚠️ Gagal terhubung ke server. Cek koneksi.<br>${err.message}</div>`;
      }
    }
  }
  
  function playNewOrderSound() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const now = ctx.currentTime;
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.frequency.value = 880;
      osc1.type = 'triangle';
      gain1.gain.setValueAtTime(0.15, now);
      gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      osc1.start();
      osc1.stop(now + 0.35);
      
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.frequency.value = 660;
      osc2.type = 'triangle';
      gain2.gain.setValueAtTime(0.12, now + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
      osc2.start(now + 0.2);
      osc2.stop(now + 0.55);
    } catch(e) {}
  }

  // auto refresh loop
  let refreshTimer = null;
  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      fetchOrders();
    }, REFRESH_INTERVAL * 1000);
  }
  
  // initial load and login simulation (no separate login for kitchen - but we use standard demo)
  // For KF kitchen we bypass PIN since it's internal display. But the base HTML had PIN.
  // According to requirement clean KDS: we embed directly (mock orders if empty for demo? BUT we call real API)
  // Also we maintain backup demo orders? no: rely on real API; but if offline show friendly.
  
  (function init() {
    // override if any leftover login style: remove login screen (we use full KDS)
    const loginDiv = document.getElementById('login-screen');
    if (loginDiv) loginDiv.style.display = 'none';
    const appDiv = document.getElementById('app');
    if (appDiv) appDiv.style.display = 'block';
    // ensure body renders properly
    fetchOrders();
    startAutoRefresh();
    // also manual refresh button if needed, but we keep simple
    // Add window click sound pref? ignore.
  })();
  
  // expose globally for inline onclick
  window.updateOrderStatus = updateOrderStatus;
  window.fetchOrders = fetchOrders;
</script>
