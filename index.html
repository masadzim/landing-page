<!DOCTYPE html>
<html lang="id">
<head>

<body class="bg-white font-sans">

  <!-- LAYANAN -->
  <section class="py-16 px-6 max-w-4xl mx-auto">

        <h3 class="font-bold mb-2">Layanan 1</h3>

      <div class="bg-gray-50 p-6 rounded-xl text-center">
        <p class="text-4xl mb-3">🚀</p>

        <p class="text-gray-500 text-sm">Deskripsi layanan kedua Anda</p>
      </div>
      <div class="bg-gray-50 p-6 rounded-xl text-center">
        <p class="text-4xl mb-3">💎</p>
        <h3 class="font-bold mb-2">Layanan 3</h3>
        <p class="text-gray-500 text-sm">Deskripsi layanan ketiga Anda</p>
      </div>
    </div>
  </section>

  <!-- KONTAK -->
  <section id="kontak" class="bg-gray-100 py-16 px-6 text-center">
    <h2 class="text-2xl font-bold mb-4">Hubungi Kami</h2>
    <p class="text-gray-600 mb-6">Siap membantu Anda sekarang</p>
    <a href="https://wa.me/628xxxxxxxxx" class="bg-green-500 text-white font-bold px-8 py-3 rounded-full">Chat WhatsApp</a>

</html>
