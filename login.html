<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>The Kebab Factory — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://www.google.com/recaptcha/api.js?render=6LdOGhItAAAAAHqcMLE_8gP81b_SUTGwX54b3czL"></script>
  <style>
    :root{
      --bg:#F8FAFC;--surface:#FFFFFF;--border:#E2E8F0;
      --text:#0F172A;--text2:#475569;--muted:#94A3B8;
      --accent:#FF6B00;--accent-d:#E05E00;--accent-s:#FFF4ED;
      --ok:#10B981;--err:#EF4444;
      --r:24px;--ri:12px;
      --sh:0 20px 60px -10px rgba(0,0,0,0.08),0 8px 20px -8px rgba(0,0,0,0.04);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .wrap{max-width:1100px;width:100%;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);display:flex;overflow:hidden;min-height:600px;}

    /* Brand Panel */
    .brand{flex:1.2;background:linear-gradient(145deg,#FF6B00 0%,#FF8A3C 60%,#FFB347 100%);padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;color:white;position:relative;overflow:hidden;}
    .brand::before{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;background:rgba(255,255,255,0.08);border-radius:50%;}
    .brand::after{content:'';position:absolute;bottom:-80px;left:-40px;width:250px;height:250px;background:rgba(0,0,0,0.06);border-radius:50%;}
    .logo-row{display:flex;align-items:center;gap:12px;position:relative;z-index:2;}
    .logo-img{width:48px;height:48px;object-fit:contain;background:white;border-radius:14px;padding:4px;box-shadow:0 8px 20px rgba(0,0,0,0.15);}
    .logo-text h2{font-weight:800;font-size:1.3rem;letter-spacing:-0.3px;}
    .logo-text p{font-size:0.7rem;opacity:0.85;font-weight:500;letter-spacing:0.5px;}
    .illus{text-align:center;position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .illus img{max-width:260px;width:100%;filter:drop-shadow(0 16px 32px rgba(0,0,0,0.2));}
    .quote{font-size:0.82rem;font-weight:500;line-height:1.6;opacity:0.92;margin-top:24px;border-top:1px solid rgba(255,255,255,0.25);padding-top:20px;text-align:center;}

    /* Form Panel */
    .form-panel{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 44px;background:white;overflow:hidden;}
    #sc .sv{animation:sIn 0.35s cubic-bezier(0.4,0,0.2,1) both;}
    @keyframes sIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
    @keyframes sBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}

    /* Role Switcher */
    .role-tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin-bottom:28px;}
    .role-tab{flex:1;padding:10px;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--muted);background:transparent;}
    .role-tab.active{background:white;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
    .role-tab i{margin-right:6px;}

    /* Step indicator */
    .pips{display:flex;gap:8px;margin-bottom:32px;}
    .pip{height:4px;border-radius:4px;flex:1;background:var(--border);transition:all 0.3s;}
    .pip.on{background:var(--accent);}
    .pip.done{background:var(--accent);opacity:0.4;}

    /* Typography */
    .lbl{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
    h1{font-size:1.75rem;font-weight:800;letter-spacing:-0.8px;color:var(--text);margin-bottom:6px;line-height:1.25;}
    .sub{font-size:0.84rem;color:var(--text2);margin-bottom:28px;line-height:1.55;}

    /* Inputs */
    .field{margin-bottom:18px;}
    label{display:block;font-size:0.78rem;font-weight:600;color:var(--text);margin-bottom:7px;}
    input[type=text],input[type=password],select{width:100%;padding:13px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--ri);font-size:0.9rem;font-family:'Inter',sans-serif;color:var(--text);outline:none;transition:all 0.2s;appearance:none;}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,0,0.1);background:#fff;}
    .inp-wrap{position:relative;}
    .toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.95rem;padding:4px;transition:color 0.2s;}
    .toggle-pw:hover{color:var(--text2);}

    /* OTP */
    .otp-grid{display:flex;gap:10px;margin-bottom:16px;justify-content:center;}
    .oi{width:52px!important;height:58px;text-align:center;font-size:1.4rem;font-weight:700;padding:0!important;border-radius:var(--ri)!important;}

    /* WA chip */
    .wa-chip{background:var(--bg);border-radius:40px;padding:7px 16px;font-size:0.8rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--text2);border:1px solid var(--border);}
    .wa-dot{width:8px;height:8px;background:var(--ok);border-radius:50%;animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}

    /* Cabang */
    .cab-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;max-height:240px;overflow-y:auto;}
    .cab-item{background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:13px;}
    .cab-item:hover{border-color:var(--accent);background:var(--accent-s);}
    .cab-item.sel{border-color:var(--accent);background:var(--accent-s);box-shadow:0 2px 8px rgba(255,107,0,0.12);}
    .cab-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
    .cab-item.sel .cab-radio{border-color:var(--accent);background:var(--accent);}
    .cab-item.sel .cab-radio::after{content:'';width:7px;height:7px;background:white;border-radius:50%;}
    .cab-nama{font-weight:700;font-size:0.9rem;}
    .cab-addr{font-size:0.72rem;color:var(--text2);margin-top:2px;}

    /* Admin OTP box */
    .admin-otp-box{background:linear-gradient(135deg,#FFF4ED,#fff);border:1.5px solid rgba(255,107,0,0.2);border-radius:16px;padding:20px;text-align:center;margin-bottom:24px;}
    .admin-otp-box i{font-size:2rem;color:var(--accent);margin-bottom:10px;display:block;}
    .admin-otp-box p{font-size:0.84rem;color:var(--text2);line-height:1.5;}

    /* Buttons */
    .btn{background:var(--accent);color:white;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:0.9rem;width:100%;cursor:pointer;transition:all 0.2s;display:flex;justify-content:center;align-items:center;gap:8px;font-family:'Inter',sans-serif;}
    .btn:hover:not(:disabled){background:var(--accent-d);transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,107,0,0.25);}
    .btn:active:not(:disabled){transform:translateY(0);}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .btn-back{background:none;border:none;color:var(--text2);font-size:0.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;padding:8px 0;transition:color 0.2s;font-family:'Inter',sans-serif;}
    .btn-back:hover{color:var(--text);}
    .btn-ghost{background:none;border:none;color:var(--accent);font-weight:600;font-size:0.82rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:'Inter',sans-serif;padding:0;}

    /* Alert */
    .alert{padding:11px 14px;border-radius:10px;font-size:0.8rem;margin-bottom:16px;display:none;line-height:1.4;}
    .alert.err{background:#FEF2F2;color:var(--err);border-left:3px solid var(--err);display:flex;align-items:flex-start;gap:8px;}
    .alert.ok{background:#ECFDF5;color:#065F46;border-left:3px solid var(--ok);display:flex;align-items:flex-start;gap:8px;}
    .alert.info{background:var(--accent-s);color:var(--accent-d);border-left:3px solid var(--accent);display:flex;align-items:flex-start;gap:8px;}

    .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .note{margin-top:18px;text-align:center;font-size:0.7rem;color:var(--muted);}

    @media(max-width:820px){.wrap{flex-direction:column;max-width:480px;min-height:auto;}.brand{padding:28px 32px;}.illus img{max-width:120px;}.quote{display:none;}.form-panel{padding:32px 28px;}.oi{width:44px!important;height:52px;}}
    @media(max-width:480px){body{padding:12px;}.form-panel{padding:24px 18px;}.otp-grid{gap:6px;}.oi{width:40px!important;height:46px;font-size:1.2rem;}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo-row">
      <img src="/icon-512.png" alt="Logo" class="logo-img"/>
      <div class="logo-text"><h2>The Kebab Factory</h2><p>Management System • Ponorogo</p></div>
    </div>
    <div class="illus">
      <img src="/logo.png" alt="Maskot"/>
      <div class="quote">Sistem terintegrasi untuk Kasir,<br>Kitchen, dan Admin.<br>Akses cepat, aman, dan nyaman.</div>
    </div>
    <div></div>
  </div>

  <div class="form-panel">
    <div id="sc"></div>
  </div>
</div>

<script>
const API = '/api/proxy';
const RCK = '6LdOGhItAAAAAHqcMLE_8gP81b_SUTGwX54b3czL';

// State
const S = {
  mode: 'kasir',   // 'kasir' | 'admin'
  step: 1,
  userId:'', nama:'', role:'', waHint:'', hint:'',
  sessionToken:'', selectedCabang:'',
  cabangList:[], username:'', password:''
};

// ── Render ──────────────────────────────────────────────────
function render(html, dir) {
  const c = document.getElementById('sc');
  c.innerHTML = `<div class="sv">${html}</div>`;
  if (dir==='back') c.querySelector('.sv').style.animation='sBack 0.35s cubic-bezier(0.4,0,0.2,1) both';
  const ois = c.querySelectorAll('.oi');
  if (ois.length) initOTP(ois);
}

function pips(cur,tot) {
  return `<div class="pips">${Array.from({length:tot},(_,i)=>`<div class="pip ${i+1<cur?'done':i+1===cur?'on':''}"></div>`).join('')}</div>`;
}

function alert_(id,msg,type='err') {
  const el=document.getElementById(id);
  if(!el)return;
  const ic={err:'fa-circle-exclamation',ok:'fa-circle-check',info:'fa-circle-info'};
  el.innerHTML=`<i class="fas ${ic[type]||ic.err}"></i><span>${msg}</span>`;
  el.className=`alert ${type}`;
}
function clearAlert(id){const e=document.getElementById(id);if(e){e.className='alert';e.innerHTML='';}}

function setLoad(id,on,lbl=''){
  const b=document.getElementById(id);
  if(!b)return;
  b.disabled=on;
  b.innerHTML=on?'<div class="spinner"></div>':lbl;
}

// ── OTP ─────────────────────────────────────────────────────
function initOTP(inputs){
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{
      inp.value=inp.value.replace(/\D/g,'');
      if(inp.value&&i<inputs.length-1)inputs[i+1].focus();
      if(getOTP())setTimeout(doVerifyOTP,150);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)inputs[i-1].focus();});
    inp.addEventListener('paste',e=>{
      e.preventDefault();
      const v=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
      v.split('').slice(0,6).forEach((c,j)=>{if(inputs[j])inputs[j].value=c;});
      inputs[Math.min(v.length,5)]?.focus();
      if(v.length>=6)setTimeout(doVerifyOTP,150);
    });
  });
  setTimeout(()=>inputs[0]?.focus(),100);
}
function getOTP(){
  const v=Array.from(document.querySelectorAll('.oi')).map(i=>i.value);
  return v.every(Boolean)?v.join(''):null;
}

// ── Mode switch ──────────────────────────────────────────────
function switchMode(mode){
  S.mode=mode;
  S.step=1;
  if(mode==='admin') renderAdminOTP();
  else renderStep1();
}

// ════════════════════════════════════════════════════════════
// KASIR/KDS — STEP 1: Username + Password
// ════════════════════════════════════════════════════════════
function renderStep1(dir){
  S.step=1;
  render(`
    ${roleTabs()}
    ${pips(1,3)}
    <div class="lbl"><i class="fas fa-key"></i> Login</div>
    <h1>Masuk ke Akun</h1>
    <p class="sub">Gunakan kredensial yang diberikan oleh manajer operasional.</p>
    <div id="al1" class="alert"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="iu" placeholder="cth: kasir_01" autocomplete="username" value="${S.username}" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="inp-wrap">
        <input type="password" id="ip" placeholder="Masukkan password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button type="button" class="toggle-pw" onclick="togglePw()"><i id="pwi" class="far fa-eye-slash"></i></button>
      </div>
    </div>
    <button class="btn" id="bl" onclick="doLogin()"><i class="fas fa-arrow-right"></i> Lanjutkan</button>
    <p class="note"><i class="fas fa-shield-alt"></i> Sistem diamankan dengan reCAPTCHA v3</p>
  `,dir);
  document.getElementById('iu')?.focus();
}

function roleTabs(){
  return `<div class="role-tabs">
    <button class="role-tab ${S.mode==='kasir'?'active':''}" onclick="switchMode('kasir')"><i class="fas fa-cash-register"></i>Kasir / KDS</button>
    <button class="role-tab ${S.mode==='admin'?'active':''}" onclick="switchMode('admin')"><i class="fas fa-user-shield"></i>Admin</button>
  </div>`;
}

function togglePw(){
  const inp=document.getElementById('ip'),icon=document.getElementById('pwi');
  if(!inp)return;
  inp.type=inp.type==='password'?'text':'password';
  icon.className=inp.type==='password'?'far fa-eye-slash':'far fa-eye';
}

// FIX: Payload diubah dari form-urlencoded menjadi JSON string agar sesuai dengan require doPost GAS
async function doLogin(){
  clearAlert('al1');
  const u=document.getElementById('iu')?.value.trim();
  const p=document.getElementById('ip')?.value.trim();
  if(!u||!p)return alert_('al1','Username dan password wajib diisi.');
  S.username=u;S.password=p;
  setLoad('bl',true);
  try{
    await new Promise(r=>grecaptcha.ready(r));
    const tok=await grecaptcha.execute(RCK,{action:'login'});
    const res=await fetch(API,{
      method:'POST',
      headers:{'Content-Type': 'application/json'},
      body: JSON.stringify({action:'login',username:u,password:p,recaptchaToken:tok})
    });
    const d=await res.json();
    if(d.success){S.userId=d.userId;S.nama=d.nama;S.role=d.role;S.waHint=d.waHint;renderStep2();}
    else{setLoad('bl',false,'<i class="fas fa-arrow-right"></i> Lanjutkan');alert_('al1',d.error||'Login gagal.');}
  }catch(e){setLoad('bl',false,'<i class="fas fa-arrow-right"></i> Lanjutkan');alert_('al1','Gagal terhubung ke server.');}
}

// ── KASIR/KDS Step 2: OTP ────────────────────────────────────
function renderStep2(dir){
  S.step=2;
  render(`
    ${pips(2,3)}
    <div class="lbl"><i class="fab fa-whatsapp"></i> Verifikasi Dua Langkah</div>
    <h1>Kode OTP</h1>
    <p class="sub">Kode 6 digit dikirim ke WhatsApp terdaftar.</p>
    <div class="wa-chip"><span class="wa-dot"></span><span>WA: ${S.waHint||'****xxxx'}</span></div>
    <div id="al2" class="alert"></div>
    <div class="otp-grid">${Array(6).fill('<input class="oi" type="text" maxlength="1" inputmode="numeric"/>').join('')}</div>
    <p style="font-size:0.78rem;color:var(--muted);margin-bottom:20px;">Tidak menerima kode? <button class="btn-ghost" onclick="resendKasirOTP()">Kirim Ulang</button></p>
    <button class="btn" id="bo" onclick="doVerifyOTP()"><i class="fas fa-check"></i> Verifikasi & Lanjut</button>
    <div style="text-align:center;margin-top:14px;"><button class="btn-back" onclick="renderStep1('back')"><i class="fas fa-chevron-left"></i> Kembali</button></div>
  `,dir);
}

// FIX: Payload diubah menjadi format JSON
async function resendKasirOTP(){
  clearAlert('al2');
  document.querySelectorAll('.oi').forEach(i=>i.value='');
  try{
    await new Promise(r=>grecaptcha.ready(r));
    const tok=await grecaptcha.execute(RCK,{action:'login'});
    await fetch(API,{
      method:'POST',
      headers:{'Content-Type': 'application/json'},
      body: JSON.stringify({action:'login',username:S.username,password:S.password,recaptchaToken:tok})
    });
    alert_('al2','OTP baru dikirim ke WhatsApp.','ok');
  }catch(e){alert_('al2','Gagal kirim ulang.');}
}

// ════════════════════════════════════════════════════════════
// ADMIN — Request OTP (tanpa username/password)
// ════════════════════════════════════════════════════════════
function renderAdminOTP(dir){
  S.step=1;
  render(`
    ${roleTabs()}
    ${pips(1,2)}
    <div class="lbl"><i class="fas fa-user-shield"></i> Admin Access</div>
    <h1>Masuk sebagai<br>Administrator</h1>
    <p class="sub">OTP akan dikirim ke nomor WA atau email yang terdaftar. Tidak perlu username/password.</p>
    <div class="admin-otp-box">
      <i class="fas fa-mobile-screen-button"></i>
      <p>Klik tombol di bawah untuk mengirim OTP ke kontak admin yang terdaftar di sistem.</p>
    </div>
    <div id="al-admin" class="alert"></div>
    <button class="btn" id="ba" onclick="doAdminRequestOTP()">
      <i class="fas fa-paper-plane"></i> Kirim OTP ke Admin
    </button>
    <p class="note"><i class="fas fa-shield-alt"></i> Dilindungi reCAPTCHA v3</p>
  `,dir);
}

// FIX: Payload diubah menjadi format JSON & action reCAPTCHA disamakan ke 'login'
async function doAdminRequestOTP(){
  clearAlert('al-admin');
  setLoad('ba',true);
  try{
    await new Promise(r=>grecaptcha.ready(r));
    const tok=await grecaptcha.execute(RCK,{action:'login'});
    const res=await fetch(API,{
      method:'POST',
      headers:{'Content-Type': 'application/json'},
      body: JSON.stringify({action:'adminRequestOTP',recaptchaToken:tok})
    });
    const d=await res.json();
    if(d.success){
      S.userId='admin';S.role='admin';S.hint=d.hint;
      renderAdminVerify(d);
    } else {
      setLoad('ba',false,'<i class="fas fa-paper-plane"></i> Kirim OTP ke Admin');
      alert_('al-admin',d.error||'Gagal mengirim OTP.');
    }
  }catch(e){setLoad('ba',false,'<i class="fas fa-paper-plane"></i> Kirim OTP ke Admin');alert_('al-admin','Gagal terhubung ke server.');}
}

function renderAdminVerify(d){
  S.step=2;
  const via = d.via==='email'
    ? `<i class="fas fa-envelope" style="color:var(--accent)"></i> Email`
    : `<i class="fab fa-whatsapp" style="color:#25D366"></i> WhatsApp`;
  render(`
    ${pips(2,2)}
    <div class="lbl"><i class="fas fa-lock"></i> Verifikasi Admin</div>
    <h1>Kode OTP</h1>
    <p class="sub">Kode 6 digit telah dikirim via ${via}.</p>
    <div class="wa-chip"><span class="wa-dot"></span><span>${d.hint||'****'}</span></div>
    <div id="al-adminv" class="alert"></div>
    <div class="otp-grid">${Array(6).fill('<input class="oi" type="text" maxlength="1" inputmode="numeric"/>').join('')}</div>
    <p style="font-size:0.78rem;color:var(--muted);margin-bottom:20px;">Tidak menerima kode? <button class="btn-ghost" onclick="renderAdminOTP('back')">Kirim Ulang</button></p>
    <button class="btn" id="bav" onclick="doVerifyOTP()"><i class="fas fa-check"></i> Masuk Dashboard</button>
    <div style="text-align:center;margin-top:14px;"><button class="btn-back" onclick="renderAdminOTP('back')"><i class="fas fa-chevron-left"></i> Kembali</button></div>
  `);
}

// ════════════════════════════════════════════════════════════
// SHARED — Verify OTP (kasir & admin)
// ════════════════════════════════════════════════════════════
// FIX: Payload diubah menjadi format JSON string
async function doVerifyOTP(){
  const alertId = S.mode==='admin' ? 'al-adminv' : 'al2';
  clearAlert(alertId);
  const otp=getOTP();
  if(!otp)return alert_(alertId,'Masukkan 6 digit kode OTP.');
  const btnId = S.mode==='admin'?'bav':'bo';
  const btnLbl = S.mode==='admin'
    ? '<i class="fas fa-check"></i> Masuk Dashboard'
    : '<i class="fas fa-check"></i> Verifikasi & Lanjut';
  setLoad(btnId,true);
  try{
    const res=await fetch(API,{
      method:'POST',
      headers:{'Content-Type': 'application/json'},
      body: JSON.stringify({action:'verifyOTP',userId:S.userId,otp:otp})
    });
    const d=await res.json();
    if(d.success){
      S.sessionToken=d.sessionToken;S.role=d.user.role;
      if(S.role==='admin'){saveAndRedirect(null);}
      else{await fetchCabang();renderStep3();}
    }else{
      setLoad(btnId,false,btnLbl);
      document.querySelectorAll('.oi').forEach(i=>i.value='');
      document.querySelectorAll('.oi')[0]?.focus();
      alert_(alertId,d.error||'OTP tidak valid.');
    }
  }catch(e){setLoad(btnId,false,btnLbl);alert_(alertId,'Gagal terhubung ke server.');}
}

// ════════════════════════════════════════════════════════════
// KASIR/KDS — STEP 3: Pilih Cabang
// ════════════════════════════════════════════════════════════
async function fetchCabang(){
  try{
    const res=await fetch(`${API}?action=getCabang`);
    const d=await res.json();
    S.cabangList=(d.success&&d.cabang)?d.cabang:[];
  }catch(e){S.cabangList=[];}
}

function renderStep3(dir){
  S.step=3;S.selectedCabang='';
  const html=S.cabangList.length
    ?S.cabangList.map(c=>`
      <div class="cab-item" onclick="selCabang('${c.idCabang}',this)">
        <div class="cab-radio"></div>
        <div>
          <div class="cab-nama">${c.namaCabang}</div>
          ${c.alamat?`<div class="cab-addr"><i class="fas fa-location-dot" style="font-size:0.65rem"></i> ${c.alamat}</div>`:''}
        </div>
      </div>`).join('')
    :'<p style="color:var(--muted);font-size:0.85rem;padding:8px 0">Tidak ada cabang aktif.</p>';

  render(`
    ${pips(3,3)}
    <div class="lbl"><i class="fas fa-store"></i> Pilih Lokasi</div>
    <h1>Pilih Cabang</h1>
    <p class="sub">Kamu bertugas di cabang mana hari ini?</p>
    <div id="al3" class="alert"></div>
    <div class="cab-list">${html}</div>
    <button class="btn" id="bc" onclick="doSelectCabang()" disabled><i class="fas fa-play"></i> Mulai Bekerja</button>
    <div style="text-align:center;margin-top:14px;"><button class="btn-back" onclick="renderStep2('back')"><i class="fas fa-chevron-left"></i> Kembali</button></div>
  `,dir);

  if(S.cabangList.length===1){
    const item=document.querySelector('.cab-item');
    if(item)selCabang(S.cabangList[0].idCabang,item);
  }
}

function selCabang(id,el){
  document.querySelectorAll('.cab-item').forEach(i=>i.classList.remove('sel'));
  el.classList.add('sel');
  S.selectedCabang=id;
  const b=document.getElementById('bc');
  if(b)b.disabled=false;
}

function doSelectCabang(){
  if(!S.selectedCabang)return alert_('al3','Pilih cabang terlebih dahulu.');
  saveAndRedirect(S.selectedCabang);
}

// ── Save & Redirect ──────────────────────────────────────────
function saveAndRedirect(idCabang){
  localStorage.setItem('kf_session',JSON.stringify({
    sessionToken:S.sessionToken,userId:S.userId,
    nama:S.nama,role:S.role,idCabang,
    loginAt:new Date().toISOString()
  }));
  const map={admin:'admin/dashboard.html',kasir:'kasir.html',kds:'kds.html'};
  window.location.href=map[S.role]||'dashboard.html';
}

// ── Enter key support ────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(S.mode==='kasir'&&S.step===1)doLogin();
  if(S.mode==='kasir'&&S.step===3)doSelectCabang();
});

// ── Init: cek session aktif ──────────────────────────────────
(function init(){
  try{
    const raw=localStorage.getItem('kf_session');
    if(!raw)return renderStep1();
    const s=JSON.parse(raw);
    if(!s?.sessionToken)return renderStep1();
    fetch(`${API}?action=verifySession&sessionToken=${s.sessionToken}`)
      .then(r=>r.json())
      .then(d=>{
        if(d.success){const m={admin:'admin/dashboard.html',kasir:'kasir.html',kds:'kds.html'};window.location.href=m[s.role]||'dashboard.html';}
        else{localStorage.removeItem('kf_session');renderStep1();}
      }).catch(()=>{localStorage.removeItem('kf_session');renderStep1();});
  }catch(e){localStorage.removeItem('kf_session');renderStep1();}
})();
</script>
</body>
</html>
