<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Kebab Factory|Kitchen Display System </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest-kds.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="theme-color" content="#111827">
  <link rel="apple-touch-icon" href="https://thekebabfactory.github.io/Icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KF KDS">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #111827; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 20px; min-height: 100vh; color: #F3F4F6; }
    .kds-container { max-width: 1800px; margin: 0 auto; }
    .kds-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 28px; gap: 16px; border-bottom: 2px solid #374151; padding-bottom: 16px; }
    .brand h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #FF6B00, #FF8C42); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand p { font-size: 0.8rem; font-weight: 500; color: #9CA3AF; letter-spacing: 0.5px; }
    .stats-group { display: flex; gap: 28px; background: #1F2937; padding: 8px 24px; border-radius: 60px; border: 1px solid #374151; }
    .stat-badge { font-weight: 700; font-size: 1rem; }
    .stat-badge span { font-size: 1.5rem; font-weight: 800; margin-right: 6px; color: #FF6B00; }
    .kanban-board { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: thin; }
    .kanban-col { flex: 1; min-width: 280px; background: #111827; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; }
    .col-header { background: #1F2937; padding: 16px 12px; border-radius: 20px; text-align: center; border-left: 5px solid; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: baseline; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
    .col-header .col-count { background: #111827; padding: 4px 10px; border-radius: 40px; font-size: 0.9rem; font-weight: 700; }
    .col-new { border-left-color: #6B7280; }
    .col-diproses { border-left-color: #FF6B00; }
    .col-siap { border-left-color: #10B981; }
    .col-diantar { border-left-color: #60A5FA; }
    .col-diambil { border-left-color: #A78BFA; }
    .col-selesai { border-left-color: #4B5563; }
    .cards-container { display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 210px); overflow-y: auto; padding-right: 4px; }
    .order-card { background: #1F2937; border-radius: 20px; padding: 20px 18px; transition: all 0.1s ease; border: 1px solid #374151; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .order-card:hover { background: #2D3A4E; border-color: #FF6B0040; }
    .card-row-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px dashed #374151; padding-bottom: 12px; }
    .order-num { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.3px; background: #FF6B0020; padding: 2px 10px; border-radius: 40px; color: #FF9F5C; font-family: monospace; }
    .elapsed-time { font-size: 1.2rem; font-weight: 700; background: #111827; padding: 4px 12px; border-radius: 32px; color: #FCD34D; font-feature-settings: 'tnum'; letter-spacing: 0.5px; }
    .order-meta { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .type-badge { background: #0F172A; padding: 5px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #CBD5E1; }
    .type-badge.delivery { border-left: 3px solid #60A5FA; background: #1E2A3A; }
    .type-badge.pickup { border-left: 3px solid #A78BFA; background: #1E2A3A; }
    .items-list { margin: 12px 0 16px 0; display: flex; flex-direction: column; gap: 14px; }
    .item-line { font-size: 1.2rem; font-weight: 600; line-height: 1.4; display: flex; justify-content: space-between; align-items: baseline; border-left: 3px solid #FF6B00; padding-left: 12px; }
    .item-name { font-weight: 700; font-size: 1.15rem; word-break: break-word; color: #F9FAFB; }
    .item-qty { font-weight: 800; font-size: 1.2rem; background: #111827; padding: 2px 12px; border-radius: 32px; color: #FF8C42; }
    .modifiers { margin-top: 8px; margin-left: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
    .mod-tag { background: #2D3748; padding: 5px 12px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; color: #E5E7EB; display: inline-flex; align-items: center; gap: 5px; }
    .mod-tag::before { content: "·"; font-weight: 900; color: #FF6B00; font-size: 1rem; }
    .action-status-btn { width: 100%; margin-top: 20px; background: #FF6B00; border: none; padding: 14px 10px; border-radius: 60px; font-weight: 800; font-size: 1.25rem; letter-spacing: 1.5px; text-transform: uppercase; color: white; cursor: pointer; transition: all 0.1s linear; text-align: center; font-family: 'Inter', monospace; }
    .action-status-btn.completed-btn { background: #374151; cursor: default; opacity: 0.8; }
    .action-status-btn:hover:not(.completed-btn) { background: #E05E00; transform: scale(0.98); }
    .order-card.completed-card { background: #1A2536; border-color: #2D3A4E; opacity: 0.85; }
    .empty-col-message { text-align: center; padding: 40px 16px; background: #1F2937; border-radius: 24px; color: #6B7280; font-weight: 600; font-size: 0.9rem; border: 1px dashed #374151; }
    .kanban-board::-webkit-scrollbar { height: 6px; }
    .kanban-board::-webkit-scrollbar-track { background: #1F2937; border-radius: 8px; }
    .kanban-board::-webkit-scrollbar-thumb { background: #FF6B00; border-radius: 8px; }
    .header-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .cabang-badge { background:#1F2937; padding:6px 16px; border-radius:40px; font-size:0.8rem; font-weight:700; border:1px solid #374151; display:flex; align-items:center; gap:8px; color:#F3F4F6; }
    .cabang-badge i { color:#FF6B00; }
    .kds-btn { background:#1F2937; border:1px solid #374151; color:#F3F4F6; padding:8px 14px; border-radius:40px; font-size:0.8rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; font-family:'Inter',sans-serif; }
    .kds-btn:hover { background:#2D3A4E; }
    .kds-btn.logout { color:#F87171; }
    .kds-btn.logout:hover { background:#7F1D1D40; }
    .live-pulse { display: flex; align-items: center; gap: 6px; background: #1F2937; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
    .dot { width: 10px; height: 10px; background-color: #10B981; border-radius: 50%; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
    @media (max-width: 900px) { body { padding: 12px; } .order-num { font-size: 1.1rem; } .item-name { font-size: 0.95rem; } .item-qty { font-size: 1rem; } .action-status-btn { font-size: 1rem; padding: 10px; } }
  </style>
</head>
<body>

<div class="kds-container">
  <div class="kds-header">
    <div class="brand">
      <h1>The Kebab Factory </h1>
      <p>Kitchen Display System</p>
    </div>
    <div class="header-right">
      <div class="cabang-badge"><i class="fas fa-store"></i> <span id="cabang-name">Memuat...</span></div>
      <div class="stats-group" id="global-stats">
        <div class="stat-badge"><span id="total-active">0</span> aktif</div>
        <div class="live-pulse"><span class="dot"></span> LIVE · auto refresh</div>
      </div>
      <button class="kds-btn" onclick="toggleFullscreen()"><i class="fas fa-expand"></i></button>
      <button class="kds-btn logout" onclick="doLogout()"><i class="fas fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div class="kanban-board" id="kanban-board"></div>
</div>

<script>
  // ============================================================
  // AUTH & SESI
  // ============================================================
  const APPS_SCRIPT_URL = '/api/proxy';
  const REFRESH_INTERVAL = 15;
  let allOrders = [];
  let knownOrderIds = new Set();
  let isFirstLoad = true;
  let session = null;

  (function checkAuth(){
    try {
      const raw = localStorage.getItem('kf_session');
      if(!raw) return redirectLogin();
      session = JSON.parse(raw);
      if(!session?.sessionToken || !['kds','kasir','admin'].includes(session.role)) return redirectLogin();
    } catch(e){ return redirectLogin(); }
  })();
  function redirectLogin(){ localStorage.removeItem('kf_session'); window.location.href='login.html'; }
  function doLogout(){ if(!confirm('Yakin keluar?'))return; localStorage.removeItem('kf_session'); window.location.href='login.html'; }
  function toggleFullscreen(){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  }

  // Register Service Worker (PWA)
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }

  // Tampilkan info cabang
  if(session){
    if(session.idCabang){
      fetch(APPS_SCRIPT_URL+'?action=getCabang').then(r=>r.json()).then(d=>{
        const c=(d.cabang||[]).find(x=>x.idCabang===session.idCabang);
        document.getElementById('cabang-name').textContent = c ? c.namaCabang : session.idCabang;
      }).catch(()=>{ document.getElementById('cabang-name').textContent = session.idCabang; });
    } else {
      document.getElementById('cabang-name').textContent = session.role==='admin' ? 'Semua Cabang' : '—';
    }
  }

  function getNextStatus(currentStatus, orderType = 'delivery') {
    switch(currentStatus) {
      case 'Baru': return 'Diproses';
      case 'Diproses': return 'Siap';
      case 'Siap': return (orderType === 'delivery') ? 'Diantar' : 'Diambil';
      case 'Diantar': return 'Selesai';
      case 'Diambil': return 'Selesai';
      default: return null;
    }
  }

  function getOrderType(order) {
    const deliveryField = String(order.pengiriman || '').toLowerCase();
    if (deliveryField.includes('delivery')) return 'delivery';
    if (deliveryField.includes('pickup') || deliveryField.includes('ambil')) return 'pickup';
    return (order.alamat && order.alamat !== '-' && order.alamat !== '') ? 'delivery' : 'pickup';
  }

  function getElapsedMinutes(timestampStr) {
    if (!timestampStr) return '0 min';
    const orderDate = new Date(timestampStr);
    if (isNaN(orderDate.getTime())) return '—';
    const diffMs = Date.now() - orderDate.getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 0) return '0 min';
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    return `${hours}h ${mins % 60}m`;
  }

  // ============================================================
  // FIX: parseItemsWithModifiers — handle "NamaItemx1" suffix
  // ============================================================
  function parseItemsWithModifiers(itemsStr) {
    if (!itemsStr) return [];
    const result = [];
    const rawItems = itemsStr.split(',').map(i => i.trim()).filter(i => i);

    for (let raw of rawItems) {
      let qty = 1;
      let namePart = raw;

      // Strip parentheses & brackets first (modifiers) before qty detection
      let modifiers = [];
      const parenMatch = namePart.match(/\(([^)]+)\)/);
      if (parenMatch) {
        modifiers.push(parenMatch[1]);
        namePart = namePart.replace(`(${parenMatch[1]})`, '').trim();
      }
      const bracketMatch = namePart.match(/\[([^\]]+)\]/);
      if (bracketMatch) {
        modifiers.push(bracketMatch[1]);
        namePart = namePart.replace(`[${bracketMatch[1]}]`, '').trim();
      }

      // FIX: Detect qty — support both "2x Nama" (prefix) AND "Namax2" (suffix, no space)
      const qtyPrefix = namePart.match(/^(\d+)x\s+(.+)$/i);      // "2x Kebab Original"
      const qtySuffix = namePart.match(/^(.+?)x(\d+)$/i);         // "Kebab Originalx2"
      const qtySpacedSuffix = namePart.match(/^(.+?)\s+x(\d+)$/i); // "Kebab Original x2"

      if (qtyPrefix) {
        qty = parseInt(qtyPrefix[1], 10);
        namePart = qtyPrefix[2].trim();
      } else if (qtySpacedSuffix) {
        qty = parseInt(qtySpacedSuffix[2], 10);
        namePart = qtySpacedSuffix[1].trim();
      } else if (qtySuffix) {
        // Only treat as qty suffix if the number is at the very end after "x"
        // and it's clearly a quantity pattern (not part of the name like "7-Eleven")
        qty = parseInt(qtySuffix[2], 10);
        namePart = qtySuffix[1].trim();
      }

      // Extra modifier detection
      const extraMatch = namePart.match(/(Extra\s+\w+)/i);
      if (extraMatch && !modifiers.includes(extraMatch[1])) modifiers.push(extraMatch[1]);
      if (namePart.toLowerCase().includes('pedas') && !modifiers.some(m => m.toLowerCase().includes('pedas'))) {
        modifiers.push('🌶️ Pedas');
      }

      result.push({
        qty,
        name: namePart || raw.substring(0, 30),
        modifiers: modifiers.slice(0, 3)
      });
    }
    return result;
  }

  function renderKanban() {
    const board = document.getElementById('kanban-board');
    const statuses = ['Baru', 'Diproses', 'Siap', 'Diantar', 'Diambil', 'Selesai'];
    const statusLabels = { Baru: '🆕 BARU', Diproses: '🔥 DIPROSES', Siap: '✅ SIAP', Diantar: '🛵 DIANTAR', Diambil: '🛍️ DIAMBIL', Selesai: '✓ SELESAI' };
    const colAccents = { Baru: 'col-new', Diproses: 'col-diproses', Siap: 'col-siap', Diantar: 'col-diantar', Diambil: 'col-diambil', Selesai: 'col-selesai' };

    let activeCount = allOrders.filter(o => o.status !== 'Selesai' && o.status !== 'Batal').length;
    document.getElementById('total-active').innerText = activeCount;

    let columnsHtml = '';
    for (let status of statuses) {
      const ordersInCol = allOrders.filter(order => order.status === status);
      const sorted = [...ordersInCol].sort((a, b) => {
        const tA = a.timestamp || a.orderId || '';
        const tB = b.timestamp || b.orderId || '';
        return tA.localeCompare(tB);
      });

      let cardsHtml = '';
      for (let order of sorted) {
        const orderType = getOrderType(order);
        const elapsed = getElapsedMinutes(order.timestamp);
        const itemsParsed = parseItemsWithModifiers(order.items || '');
        const isCompleted = (order.status === 'Selesai' || order.status === 'Batal');
        const nextStatus = getNextStatus(order.status, orderType);
        const buttonLabel = (order.status === 'Siap')
          ? (orderType === 'delivery' ? '🛵 KIRIM' : '📦 DIAMBIL')
          : (nextStatus ? `▶ ${nextStatus.toUpperCase()}` : 'SELESAI');

        let itemsHtml = '';
        for (let it of itemsParsed) {
          itemsHtml += `
            <div class="item-line">
              <span class="item-name">${escapeHtml(it.name)}</span>
              <span class="item-qty">×${it.qty}</span>
            </div>`;
          if (it.modifiers && it.modifiers.length) {
            itemsHtml += '<div class="modifiers">' + it.modifiers.map(mod => `<span class="mod-tag">${escapeHtml(mod)}</span>`).join('') + '</div>';
          }
        }
        if (itemsParsed.length === 0) {
          itemsHtml = `<div class="item-line"><span class="item-name">— item tidak tersedia —</span></div>`;
        }

        let globalNote = '';
        if (order.catatan && order.catatan !== '-') {
          globalNote = `<div class="modifiers" style="margin-top:6px;"><span class="mod-tag">📝 ${escapeHtml(order.catatan)}</span></div>`;
        }

        cardsHtml += `
          <div class="order-card ${isCompleted ? 'completed-card' : ''}" data-order-id="${order.orderId}">
            <div class="card-row-top">
              <div class="order-num">${escapeHtml(order.orderId || '---')}</div>
              <div class="elapsed-time">⏱️ ${elapsed}</div>
            </div>
            <div class="order-meta">
              <span class="type-badge ${orderType === 'delivery' ? 'delivery' : 'pickup'}">
                ${orderType === 'delivery' ? '🚚 DELIVERY' : '🏪 PICKUP'}
              </span>
              <span class="type-badge" style="background:#1F2A3E;">💳 ${escapeHtml(order.pembayaran || 'Cash')}</span>
              ${order.total ? `<span class="type-badge" style="background:#FF6B0010;">💰 ${escapeHtml(order.total)}</span>` : ''}
            </div>
            <div class="items-list">${itemsHtml}</div>
            ${globalNote}
            ${!isCompleted && nextStatus ? `<button class="action-status-btn" onclick="updateOrderStatus('${order.orderId}', '${nextStatus}')">${buttonLabel}</button>` : (isCompleted ? `<button class="action-status-btn completed-btn" disabled>✓ SELESAI</button>` : '')}
          </div>`;
      }

      if (cardsHtml === '') {
        cardsHtml = `<div class="empty-col-message">✨ Tidak ada pesanan</div>`;
      }

      columnsHtml += `
        <div class="kanban-col">
          <div class="col-header ${colAccents[status]}">
            <span>${statusLabels[status]}</span>
            <span class="col-count">${ordersInCol.length}</span>
          </div>
          <div class="cards-container">${cardsHtml}</div>
        </div>`;
    }
    board.innerHTML = columnsHtml;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  }

  async function updateOrderStatus(orderId, newStatus) {
    const orderIndex = allOrders.findIndex(o => o.orderId === orderId);
    if (orderIndex === -1) return;
    const oldStatus = allOrders[orderIndex].status;
    allOrders[orderIndex].status = newStatus;
    renderKanban();
    updateStatsFromOrders();
    try {
      const payload = new URLSearchParams();
      payload.append('action', 'updateStatus');
      payload.append('orderId', orderId);
      payload.append('status', newStatus);
      payload.append('sessionToken', session?.sessionToken||'');
      await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: payload });
      if (newStatus === 'Siap') playShortBeep();
    } catch (err) {
      console.warn('Status sync error, revert:', err);
      allOrders[orderIndex].status = oldStatus;
      renderKanban();
      updateStatsFromOrders();
    }
  }

  function playShortBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; osc.type = 'sine'; gain.gain.value = 0.2;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
      osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  }

  function updateStatsFromOrders() {
    const active = allOrders.filter(o => o.status !== 'Selesai' && o.status !== 'Batal').length;
    document.getElementById('total-active').innerText = active;
  }

  async function fetchOrders() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getAllOrders&sessionToken=${session?.sessionToken||''}&nocache=${Date.now()}`);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Invalid JSON'); }
      if (data && data.orders) {
        data.orders.forEach(order => {
          if (!knownOrderIds.has(order.orderId) && !isFirstLoad) playNewOrderSound();
          knownOrderIds.add(order.orderId);
        });
        allOrders = data.orders.map(order => ({
          ...order,
          status: order.status || 'Baru',
          timestamp: order.timestamp || order.createdAt || new Date().toLocaleString(),
          items: order.items || '',
          nama: order.nama || 'Pelanggan',
          noWA: order.noWA || '',
          alamat: order.alamat || '',
          pengiriman: order.pengiriman || (order.alamat ? 'Delivery' : 'Pickup'),
          pembayaran: order.pembayaran || 'Cash',
          total: order.total || '',
          catatan: order.catatan || order.note || ''
        }));
        isFirstLoad = false;
        renderKanban();
        updateStatsFromOrders();
      } else if (data.error) {
        console.error('API error:', data.error);
      }
    } catch (err) {
      console.error('fetch error:', err);
      if (allOrders.length === 0) {
        document.getElementById('kanban-board').innerHTML = `<div class="empty-col-message" style="grid-column:1/-1;text-align:center;">⚠️ Gagal terhubung ke server.<br>${err.message}</div>`;
      }
    }
  }

  function playNewOrderSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [[880, 0, 0.4], [660, 0.2, 0.55]].forEach(([freq, start, stop]) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = 'triangle';
        gain.gain.setValueAtTime(0.15, now + start);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + stop);
        osc.start(now + start); osc.stop(now + stop);
      });
    } catch(e) {}
  }

  let refreshTimer = null;
  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(fetchOrders, REFRESH_INTERVAL * 1000);
  }

  (function init() {
    fetchOrders();
    startAutoRefresh();
  })();

  window.updateOrderStatus = updateOrderStatus;
  window.fetchOrders = fetchOrders;
</script>
</body>
</html>
